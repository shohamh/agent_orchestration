# Agent board: kanban view over Hatchet and/or Trigger.dev runs.
#   cp .env.example .env   # fill in the credentials for the backends you want
#   docker compose up -d --build        -> http://localhost:8090
# It reaches both stacks through their published host ports (host.docker.internal), so it doesn't
# need to join their networks and works whichever of them is running.
name: agent-board

services:
  board:
    build:
      context: .
      args:
        # Engine SDKs to build in: hatchet for the Hatchet tab, or empty
        ENGINES: ${ENGINES:-}
    image: agent-board:local
    restart: unless-stopped
    ports:
      - "${BOARD_PORT:-8090}:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Login (required before exposing the board beyond this PC): see .env.example
      BOARD_PASSWORD: ${BOARD_PASSWORD:-}
      BOARD_SECRET: ${BOARD_SECRET:-}
      # Hatchet (leave HATCHET_CLIENT_TOKEN empty to disable)
      HATCHET_CLIENT_TOKEN: ${HATCHET_CLIENT_TOKEN:-}
      HATCHET_CLIENT_HOST_PORT: ${HATCHET_GRPC:-host.docker.internal:7077}
      HATCHET_CLIENT_SERVER_URL: ${HATCHET_URL:-http://host.docker.internal:8080}
      HATCHET_CLIENT_TLS_STRATEGY: none
      # Trigger.dev (leave TRIGGER_SECRET_KEY empty to disable): an environment's secret key, e.g. tr_prod_...
      TRIGGER_SECRET_KEY: ${TRIGGER_SECRET_KEY:-}
      TRIGGER_DEV_SECRET_KEY: ${TRIGGER_DEV_SECRET_KEY:-}
      TRIGGER_API_URL: ${TRIGGER_URL:-http://host.docker.internal:8030}
      # Prefect (leave empty to disable): the server's REST API
      PREFECT_API_URL: ${PREFECT_API_URL:-}
      # Portable flows: the flow host on the worker PC (agents/flow_host.py)
      FLOW_HOST_URL: ${FLOW_HOST_URL:-http://host.docker.internal:8095}
      FLOW_HOST_TOKEN: ${FLOW_HOST_TOKEN:-}
      # The relay PCs install through and connect to (flow host starts it): see docs/workers-and-context.md
      FLOW_RELAY_URL: ${FLOW_RELAY_URL:-http://host.docker.internal:8097}
      # Browser-visible engine dashboards (use reachable hostnames when opening from a phone).
      HATCHET_DASHBOARD_URL: ${HATCHET_DASHBOARD_URL:-http://localhost:8080}
      TRIGGER_DASHBOARD_URL: ${TRIGGER_DASHBOARD_URL:-http://localhost:8030}
      TRIGGER_DASHBOARD_PATH: ${TRIGGER_DASHBOARD_PATH:-}
      PREFECT_DASHBOARD_URL: ${PREFECT_DASHBOARD_URL:-http://localhost:4200}
      BOARD_ENGINE_SETTINGS_PATH: /data/engine-settings.json
      # Backend Python source watcher (development only; off unless explicitly enabled).
      BOARD_AUTO_RELOAD: ${BOARD_AUTO_RELOAD:-0}
    volumes:
      - board_data:/data

volumes:
  board_data:
