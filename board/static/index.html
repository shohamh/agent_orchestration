  if (node.kind) { renderFlowNode(panel, node); return; }
  const facts = [["Status", node.status], ["Started", AgentChat.localTime(node.started_at)], ["Finished", AgentChat.localTime(node.finished_at)],
    ["Took", node.started_at && node.finished_at ? secs(node.started_at, node.finished_at) : null], ["Run id", node.ref]];
  panel.replaceChildren(...[
    el("h5", {}, node.label),
    el("dl", {}, ...facts.filter(([, v]) => v).flatMap(([k, v]) => [el("dt", {}, k), el("dd", {}, v)])),
    node.error ? el("pre", {}, node.error) : null,
    node.output != null ? el("div", {}, el("h4", {}, "Output"), el("pre", {}, JSON.stringify(node.output, null, 2))) : null,
    el("div", {}, el("h4", {}, "Logs / intermediate results"), nodeLogList),
  ].filter(Boolean));
  nodeLog.render();
}

// Whether a step can be restarted now, and why or why not. The panel's button and the graph's menu share it.
function restartState(node, card) {
  const disabled = !node.restart_supported || !node.ref || !["done", "stopped"].includes(card?.column);
  return { disabled, title: !node.restart_supported ? node.restart_reason || "This engine has no native dependent-step replay"
    : disabled ? "Stop or finish the flow before restarting a step"
    : node.restart_mode === "runtime" ? "Start a new run from this step and its descendants, reusing other results and workspace files"
    : "Replay this step; the engine restarts its dependent descendants" };
}
// Resolves false if the engine refused, so the button can be used again.
async function restartStep(node) {
  const current = runKey(), ref = node.ref, wanted = restartWorkers.get(nodeKey(ref));
  try {
    const data = await api("POST", `/api/cards/${system}/${encodeURIComponent(openCardId)}/nodes/${encodeURIComponent(ref)}/restart`, wanted ? { worker: wanted } : {});
    if (current !== runKey()) return true;
    if (data.replayed) { dag.final = false; refreshDag(); setStatus("Engine accepted step replay; watching the run…"); }
    else { pendingOpen = data.id; setStatus("Restart created; waiting for the new run…"); }
    refresh();
    return true;
  } catch (e) { if (current === runKey()) setStatus(e.message, true); return false; }
}

function renderFlowNode(panel, node) {
  const card = cards.find(c => c.id === openCardId), key = nodeKey(node.ref);
  const restart = el("button", { class: "secondary restart-step", type: "button", onclick: async () => {
    restart.disabled = true;
    if (!(await restartStep(node))) restart.disabled = false;
  } }, "Restart step");
  const can = restartState(node, card);
  restart.disabled = can.disabled;
  restart.title = can.title;
  const header = el("div", { class: "row" }, el("h5", {}, `${node.label} · ${node.kind}`), backendLink(node.backend_url), restart);
  const actual = node.execution?.worker, worker = stepWorkerOf(node);
  header.append(worker ? el('span', {class:'status step-worker', title: actual ? `${actual.hostname} · pool ${actual.pool}${actual.tags?.length ? ' · '+actual.tags.join(', ') : ''}` : ''}, 'On ', workerChip(worker))
    : node.execution ? FlowBuilder.executionView(node.execution) : el('span', {class:'status'}, 'Execution worker not reported'));
  if (['done','stopped'].includes(card?.column)) header.append(workerPicker('Worker for step restart', restartWorkers.get(key), value => restartWorkers.set(key,value)));
  if (!node.restart_supported && node.restart_reason) header.append(el("p", { class: "status" }, node.restart_reason));
  if (node.kind === "agent" && !node.ref) {
    // Nothing to load: the step has no run yet.
    panel.replaceChildren(header, el("p", { class: "status" }, "This step hasn't started yet."));
  } else if (node.kind === "agent") {
    // Keep the mounted chat and its focused composer in place across graph refreshes.
    if (panel.dataset.nodeKey !== key) panel.replaceChildren(header, nodeChatRoot);
    else panel.firstChild.replaceWith(header);
    const stepOffline = runNodeStatus(node).offline ? stepWorkerOf(node) : null;
    nodeChat.render({ ...node, agent: node.agent, offline_worker: stepOffline, session_state: nodeStates.get(key) || (node.column === "pending" ? "starting" : "working") }, key);
  } else {
    panel.replaceChildren(...[header, node.error ? el("pre", {}, node.error) : null,
      node.output != null ? AgentChat.jsonView(node.output, el) : null, nodeLogList].filter(Boolean));
    nodeLog.render();
  }
  panel.dataset.nodeKey = key;
}

// Flow steps and agent sessions log `EVT <json>` events; show them as text until a richer view exists.
function readableLine(line) {
  if (!line.startsWith("EVT ")) return line;
  let e; try { e = JSON.parse(line.slice(4)); } catch { return line; }
  if (e.type === "log") return (e.stream === "stderr" ? "! " : "") + e.text;
  if (e.type === "agent") return e.text.trim() ? `agent: ${e.text.trim()}` : null;
  if (e.type === "user") return `you: ${e.text}`;
  if (e.type === "tool") return e.status === "running" ? `tool ${e.name || ""}: ${e.summary || ""}` : null;
  if (e.type === "status") return `[${e.state}${e.reason ? ": " + e.reason : ""}]`;
  if (e.type === "step") return `[step ${e.state}${e.exit_code != null ? ", exit " + e.exit_code : ""}]`;
  if (e.type === "error") return `error: ${e.message}`;
  return null;
}

let dagLoading = null;
let dagAgain = null;
let dagSerial = 0, nodeLogSerial = 0;
async function refreshDag() {
  const card = cards.find((c) => c.id === openCardId);
  const key = runKey();
  if (!card || card.task === "agent-session") { $("d-dag-section").hidden = true; return; }
  if (dagLoading === key) { dagAgain = key; return; }
  // A finished graph doesn't change: fetch it once.
  if (dag && dag.cardId === card.id && dag.final && dag.finishedAt === card.finished_at && ["done", "stopped"].includes(card.column)) return;
  dagLoading = key;
  const serial = ++dagSerial;
  try {
    const data = await api("GET", `/api/cards/${system}/${encodeURIComponent(card.id)}/dag?task=${encodeURIComponent(card.task)}`);
    if (key !== runKey() || serial !== dagSerial) return;
    dag = { ...data, cardId: card.id, final: ["done", "stopped"].includes(card.column), finishedAt: card.finished_at };
    renderDag();
    if (selectedNode) refreshNodeLogs();
    refresh(); // a previously pending step may now have its own run id
  } catch (e) { if (key === runKey() && serial === dagSerial) setStatus(e.message, true); }
  finally {
    if (serial === dagSerial) {
      dagLoading = null;
      if (dagAgain === key && key === runKey()) {
        dagAgain = null;
        if (dag) dag.final = false;
        queueMicrotask(refreshDag);
      }
    }
  }
}

async function act(action, body) {
  const key = runKey();
  // The board pushes the result: the server refreshes watched boards right after any action.
  try { setStatus(`${action}…`); await api("POST", `/api/cards/${system}/${encodeURIComponent(openCardId)}/${action}`, body); }
  catch (e) { if (key === runKey()) setStatus(e.message, true); }
}

function setStatus(text, error = false) { const s = $("status"); s.textContent = text; s.title = text; s.classList.toggle("error", error); delete s.dataset.feed; }

// ---------------------------------------------------------------- Live updates
// One server-sent event stream per (backend, board, open card). The server watches the engine's
// live feed and pushes only what changed: card patches, plus the open card's new transcript rows
// or log lines. refresh() (re)connects only when that context changed, so it is cheap to call.
let live = null;      // { key, source }
let feedLive = false; // the engine feed is up (otherwise the server polls every few seconds)
let pendingOpen = null; // a card just created here: open it once it shows up
let retryTimer = null;
const liveKey = () => `${contextKey()}/${openCardId ?? ""}/${selectedStep()?.ref ?? ""}`;
function refresh() {
  if (!system || document.hidden || live?.key === liveKey()) return;
  live?.source.close();
  clearTimeout(retryTimer);
  const card = openCardId, context = contextKey();
  const params = new URLSearchParams({ system, board, compact: "1" });
  if (card) params.set("card", card);
  const node = selectedStep();
  if (card && node?.ref && node.kind) { params.set("node", node.ref); params.set("kind", node.kind); }
  const source = new EventSource(`/api/live?${params}`);
  live = { key: liveKey(), source };
  source.onmessage = (event) => { if (live?.source === source && context === contextKey()) onLive(JSON.parse(event.data)); };
  source.onerror = async () => {
    if (live?.source !== source) return;
    setStatus(`${SYSTEM_LABELS[system]} · reconnecting…`, true);
    if (source.readyState !== EventSource.CLOSED) return; // the browser retries by itself
    // A refused stream (e.g. the sign-in expired) is not retried by the browser: find out why.
    live = null;
    try { await api("GET", "/api/systems"); retryTimer = setTimeout(refresh, 3000); }
    catch (e) { setStatus(e.message === "Sign in required" ? "Signed out · reload the page to sign in" : e.message, true); }
  };
}
function closeLive() { live?.source.close(); live = null; }
// A hidden tab streams nothing; coming back reconnects and catches up from a fresh snapshot.
document.addEventListener("visibilitychange", () => { if (document.hidden) closeLive(); else refresh(); });

function liveStatus() {
  const count = query ? `${filteredCards().length} of ${cards.length} cards match` : `${cards.length} cards`;
  setStatus(`${feedLive ? "Live" : "Polling"} · ${count}`);
  $("status").dataset.feed = feedLive ? "live" : "polling";
  $("status").title = `${feedLive ? "Live updates" : "Refreshing every few seconds"} · updated ${new Date().toLocaleTimeString()}`;
}

function onLive(message) {
  if (message.type === "feed") { feedLive = message.live; if (columns.length) liveStatus(); return; }
  if (message.type === "error") { setStatus(message.message, true); chat.fail(message.message); nodeChat.fail(message.message); return; }
  if (message.type === "graph") { if (message.card === openCardId) { if (dag) dag.final = false; refreshDag(); } return; }
  if (message.type === "node-rows") {
    if (message.card !== openCardId || message.node !== selectedStep()?.ref) return;
    const key = nodeKey(message.node); nodeStates.set(key, message.state);
    renderNodePanel(); nodeChat.rows(key, message); refreshDag(); return;
  }
  if (message.type === "node-lines") {
    if (message.card === openCardId && message.node === selectedStep()?.ref && nodeLog.state.id === message.node) nodeLog.apply(message);
    refreshDag(); return;
  }
  if (message.type === "rows") { chat.rows(`${contextKey()}/${message.card}`, message); return; }
  if (message.type === "lines") { if (message.card === openCardId && cardLog.state.id === message.card) cardLog.apply(message); return; }
  if (message.type !== "cards") return;
  const before = cards.find((c) => c.id === openCardId);
  if (message.reset) {
    loadedContext = contextKey();
    if (message.cards) cards = message.cards;
    else cards = message.rows.map((row) => {
      const card = {};
      for (let i = 0; i < message.fields.length; i++) card[message.fields[i]] = row[i];
      return card;
    });
  }
  else {
    const changed = new Map(message.upsert.map((c) => [c.id, c])), removed = new Set(message.remove);
    cards = [...cards.filter((c) => !changed.has(c.id) && !removed.has(c.id)), ...changed.values()];
  }
  renderBoard();
  indexSoon();
  if (pendingOpen && cards.some((c) => c.id === pendingOpen)) { const id = pendingOpen; pendingOpen = null; openCard(id); }
  else if (openCardId) {
    const after = cards.find((c) => c.id === openCardId);
    renderDrawer();
    if (after && JSON.stringify(after) !== JSON.stringify(before)) refreshDag();
  }
  liveStatus();
}

$("board").addEventListener("change", (e) => { board = e.target.value; store.set("board", board); closeDrawer(); cards = []; schedules = []; shownLimit = {}; renderBoard(); refresh(); loadSchedules(); });
$("add-board").addEventListener("click", () => {
  const name = (prompt("Board name (letters, digits, - and _)") || "").trim();
  if (!/^[\w-]+$/.test(name)) return;
  if (!boards.includes(name)) boards.push(name);
  board = name; store.set("boards", boards); store.set("board", board); closeDrawer(); cards = []; schedules = []; shownLimit = {}; renderBoard(); renderHeader(); refresh(); loadSchedules();
});
async function loadFlows() {
  try { flows = (await api("GET", "/api/flows")).flows; } catch (e) { flows = []; setStatus(e.message, true); }
  await refreshWorkers();
}

// ---------------------------------------------------------------- Is the work really reachable?
// A card's status comes from its engine, which can't tell that the PC doing the work has gone away.
// So work placed on a worker counts as live only while the fleet can reach that worker.
let workersKnown = false;
async function refreshWorkers() {
  const before = JSON.stringify([workersKnown, executionWorkers.map((w) => [w.id, w.online])]);
  try { executionWorkers = (await api('GET', '/api/workers')).workers; workersKnown = true; }
  catch (_) { executionWorkers = []; workersKnown = false; }
  if (columns.length && before !== JSON.stringify([workersKnown, executionWorkers.map((w) => [w.id, w.online])])) {
    renderSoon();
    if (openCardId) { renderDrawer(); if (dag) renderDag(); }
  }
}
setInterval(() => { if (!document.hidden) refreshWorkers(); }, 15000);
const workerState = (id) => { const w = workersKnown ? executionWorkers.find((x) => x.id === id) : null; return !w ? "unknown" : w.online ? "online" : "offline"; };
const WORKER_WORDS = { online: "online", offline: "offline", unknown: "can't check its state" };
const UNDERWAY = new Set(["queued", "waiting", "running"]);
// The worker that keeps a card from being live, if any. A card on no worker runs on the coordinator.
function connection(card) {
  if (!["running", "waiting"].includes(card.column)) return { state: "live" };
  const ids = (card.workers || []).filter((w) => !w.state || UNDERWAY.has(w.state)).map((w) => w.id);
  const offline = ids.find((id) => workerState(id) === "offline");
  if (offline) return { state: "offline", worker: offline };
  const unknown = ids.find((id) => workerState(id) === "unknown");
  return unknown ? { state: "unknown", worker: unknown } : { state: "live" };
}
// A worker's name, its state as a dot, and a click through to what it runs.
function workerChip(id) {
  const state = workerState(id);
  return el("button", { type: "button", class: `worker-chip ${state}`, title: `${id}: ${WORKER_WORDS[state]}\nClick for what it runs and has run`, onclick: (e) => { e.stopPropagation(); openFleet("", id); } }, id);
}
const uniqueWorkers = (card) => [...new Set((card.workers || []).map((w) => w.id))];

// New card (new-card.js). Escape and the Close button close the dialog natively; drop its history
// entry too. When Back closed it, its entry is already gone and this is a no-op. Watching the `open`
// attribute (removed synchronously on every close path) is more dependable than the "close" event,
// which a background tab may deliver late.
newCard = NewCard.mount($("new-dialog"), {
  api, workerPicker, placementView: FlowBuilder.placementView,
  getSystem: () => system, getBoard: () => board, getFlows: () => flows, getWorkers: () => executionWorkers,
  loadFleet: loadFlows,
  onOpen: () => pushOverlay("dialog", () => $("new-dialog").close()),
  onClose: () => { $("new-dialog").close(); return dropOverlay("dialog"); },
  // The new card arrives on the live stream; sessions and flows open as soon as it does.
  onCreated: (id, opens, createdSystem, createdBoard) => {
    if (!opens || createdSystem !== system || createdBoard !== board) return;
    if (cards.some((c) => c.id === id)) openCard(id); else pendingOpen = id;
  },
  onScheduled: (item) => { setStatus(`Scheduled: ${item.title}`); loadSchedules(); },
});
function openNewCard(kind) { newCard.open(kind); }
function updateNewForm() { newCard?.refresh(); }
$("new-card").addEventListener("click", () => openNewCard());
new MutationObserver(() => { if (!$("new-dialog").open) dropOverlay("dialog"); })
  .observe($("new-dialog"), { attributes: true, attributeFilter: ["open"] });

// Schedules are records on the flow host, not engine runs, so they load apart from the cards.
const scheduleKey = () => `${system}/${board}`;
async function loadSchedules() {
  if (!system) return;
  const key = scheduleKey();
  try {
    const found = (await api("GET", `/api/schedules?system=${encodeURIComponent(system)}&board=${encodeURIComponent(board)}`)).schedules;
    if (key !== scheduleKey() || JSON.stringify(found) === JSON.stringify(schedules)) return;
    schedules = found;
  } catch (_) {
    if (!schedules.length) return; // the flow host is down: the board still shows the engine's cards
    schedules = [];
  }
  renderBoard();
}
setInterval(() => { if (!document.hidden) loadSchedules(); }, 15000);
const scheduleActions = {
  run: async (item) => {
    try { const r = await api("POST", `/api/schedules/${item.id}/run`, {}); setStatus(`Started: ${item.title}`); if (r.run) pendingOpen = r.run; }
    catch (e) { setStatus(e.message, true); }
    loadSchedules();
  },
  toggle: async (item, enable) => {
    try { await api("POST", `/api/schedules/${item.id}/${enable ? "enable" : "disable"}`, {}); } catch (e) { setStatus(e.message, true); }
    loadSchedules();
  },
  remove: async (item) => {
    if (!confirm(`Delete the schedule "${item.title}"? Runs it already started stay on the board.`)) return;
    try { await api("DELETE", `/api/schedules/${item.id}`); } catch (e) { setStatus(e.message, true); }
    loadSchedules();
  },
};
// ---------------------------------------------------------------- Flows (builder)
// Draft saves never restart workers; activation is an explicit, previewed step inside the builder.
const flowsDialog = $("flows-dialog");
const flowBuilder = FlowBuilder.mount(flowsDialog, {
  onClose: () => closeFlows(),
  onShowFleet: (query) => openFleet(query),
  onActivated: () => loadFlows(),
  // Run the active version: hide the builder (its unsaved edits stay for next time) and open New card.
  onRun: async (name) => { flowBuilder.hide(); flowsDialog.close(); await dropOverlay("flows"); openNewCard(`flow:${name}`); },
});
function onFlowsBack() {
  flowBuilder.confirmLeave().then((leave) => { if (leave) flowsDialog.close(); else pushOverlay("flows", onFlowsBack); });
}
async function closeFlows() {
  if (!flowsDialog.open || !(await flowBuilder.confirmLeave())) return false;
  flowsDialog.close(); await dropOverlay("flows");
  return true;
}
// Steps may have been moved in the editor: a run's graph picks up the new layout next time.
flowsDialog.addEventListener("close", () => { flowLayouts.clear(); runGraphShape = null; if (dag && openCardId) renderDag(); });
$("flows-btn").addEventListener("click", () => { flowsDialog.showModal(); pushOverlay("flows", onFlowsBack); flowBuilder.open(); });
// Escape asks before discarding unsaved edits instead of closing straight away.
flowsDialog.addEventListener("cancel", (e) => { e.preventDefault(); closeFlows(); });
function closeOnBackdrop(dialog, close) {
  dialog.addEventListener("click", (event) => {
    if (event.target === dialog) close();
  });
}
closeOnBackdrop(flowsDialog, () => closeFlows());
closeOnBackdrop($("new-dialog"), () => { $("new-dialog").close(); dropOverlay("dialog"); });
// ---------------------------------------------------------------- Fleet
const fleetDialog = $("fleet-dialog");
closeOnBackdrop(fleetDialog, () => closeFleet());
const fleet = Fleet.mount(fleetDialog, { onClose: () => closeFleet(), onOpenJob: (job) => openJob(job) });
async function closeFleet() { fleet.stop(); if (fleetDialog.open) { fleetDialog.close(); await dropOverlay("fleet"); } }
// Opens over the flow editor when a step asks to see its workers; closing returns to the editor.
function openFleet(filter = "", worker = null) { fleetDialog.showModal(); pushOverlay("fleet", () => { fleet.stop(); fleetDialog.close(); }); fleet.open({ filter, worker }); }
// From a worker's history to the card: on another backend or board, go there and open it when it arrives.
async function openJob(job) {
  await closeFleet();
  if (flowsDialog.open && !(await closeFlows())) return;
  if (job.system && (job.system !== system || job.board !== board)) {
    closeDrawer();
    system = job.system; store.set("system", system);
    board = job.board; store.set("board", board);
    if (!boards.includes(board)) { boards.push(board); store.set("boards", boards); }
    cards = []; schedules = []; shownLimit = {}; pendingOpen = job.run;
    renderBoard(); renderHeader(); refresh(); loadSchedules();
  } else if (cards.some((c) => c.id === job.run)) openCard(job.run);
  else pendingOpen = job.run;
}
$("fleet-btn").addEventListener("click", () => openFleet());
// Escape closes an open form first, then the fleet tab.
fleetDialog.addEventListener("cancel", (e) => { e.preventDefault(); if (fleet.back()) closeFleet(); });
// Admin changes only engine URLs; environment-provided credentials stay server-side.
const adminDialog = $("admin-dialog");
const admin = Admin.mount(adminDialog, { onClose: closeAdmin });
function closeAdmin() {
  admin.stop();
  if (adminDialog.open) { adminDialog.close(); return dropOverlay("admin"); }
  return Promise.resolve();
}
function openAdmin() {
  adminDialog.showModal();
  pushOverlay("admin", () => { admin.stop(); adminDialog.close(); });
  admin.open();
}
$("admin-btn").addEventListener("click", openAdmin);
adminDialog.addEventListener("cancel", (e) => { e.preventDefault(); closeAdmin(); });
closeOnBackdrop(adminDialog, () => closeAdmin());


$("d-close").addEventListener("click", closeDrawer);
// A left click outside the drawer closes it. Cards stay out of this, so clicking another card switches
// to it and dragging one works, and so does "need you", which walks through cards. Checking both press and
// click means selecting text in the drawer and letting go outside it doesn't close it. The press is seen
// before the menu closes itself (capture, registered first), so dismissing a menu closes only the menu.
const outsideDrawer = (node) => openCardId != null && !document.querySelector("dialog[open]")
  && !!node.closest && !node.closest("#drawer, .card[data-id], #needs-you, .ctx-menu, .tip, .hover-card");
let pressedOutside = false;
window.addEventListener("pointerdown", (e) => { pressedOutside = e.button === 0 && outsideDrawer(e.target) && !document.querySelector(".ctx-menu"); }, true);
document.addEventListener("click", (e) => { if (pressedOutside && outsideDrawer(e.target)) closeDrawer(); pressedOutside = false; });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && openCardId && !$("new-dialog").open && !flowsDialog.open && !fleetDialog.open) closeDrawer(); });
$("d-steer").addEventListener("submit", (e) => { e.preventDefault(); const v = $("d-instruction").value.trim(); if (v) { $("d-instruction").value = ""; act("steer", { instruction: v }); } });
$("d-stop").addEventListener("click", () => act("stop"));
$("d-cancel").addEventListener("click", () => act("cancel"));
$("d-replay").addEventListener("click", () => act("replay"));
$("d-pause").addEventListener("click", async () => {
  const card = cards.find((c) => c.id === openCardId);
  try { await api("POST", `/api/queues/${system}/${encodeURIComponent(card.queue.id)}/pause`, { paused: !card.queue.paused }); refresh(); }
  catch (e) { setStatus(e.message, true); }
});

(async () => {
  try {
    const info = await api("GET", "/api/systems");
    columns = info.columns; systems = info.systems;
    if (!systems.length) { setStatus("No backend configured (set HATCHET_CLIENT_TOKEN and/or TRIGGER_SECRET_KEY)", true); return; }
    system = systems.includes(store.get("system")) ? store.get("system") : systems[0];
    if (!boards.includes(board)) board = boards[0];
    setStatus(`${SYSTEM_LABELS[system] || system} · connecting…`);
    renderHeader(); renderBoard(); refresh(); loadFlows(); loadSchedules();
  } catch (e) { setStatus(e.message, true); }
})();
</script>
</body>
</html>
