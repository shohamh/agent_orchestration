<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>Agent Board</title>
<style>
  /* Design tokens. Every stylesheet (chat, flows, fleet) draws from these, so light and dark stay in step. */
  :root {
    color-scheme: light dark;
    --bg: #f2f3f6; --lane: #e9ebf0; --panel: #ffffff; --ink: #191e29; --muted: #5a6375; --line: #dfe2e9; --line-strong: #c6cbd6;
    --accent: #3b55d4; --accent-hover: #2f47bd; --accent-ink: #ffffff; --danger: #c1272d; --warn: #a85600; --ok: #1c7a3c;
    --violet: #6d4fc4; --slate: #5f6b80;
    --chip: #eef0f5; --hover: #f4f5f8;
    --shadow: 0 1px 2px rgba(20, 28, 48, .07);
    --shadow-hover: 0 2px 4px rgba(20, 28, 48, .07), 0 6px 16px rgba(20, 28, 48, .08);
    --shadow-float: 0 12px 40px rgba(20, 28, 48, .18), 0 2px 8px rgba(20, 28, 48, .08);
    --r-sm: 6px; --r: 8px; --r-lg: 12px;
    --sans: "Segoe UI Variable Text", "Segoe UI Variable", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "Cascadia Code", SFMono-Regular, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1014; --lane: #14171c; --panel: #1b1f27; --ink: #e9ebf1; --muted: #9ca4b4; --line: #2a2f39; --line-strong: #3c424f;
      --accent: #8fa3ff; --accent-hover: #a5b5ff; --accent-ink: #0c1020; --danger: #ff8080; --warn: #f4b352; --ok: #63d48d;
      --violet: #b9a2f7; --slate: #98a3b7;
      --chip: #262b35; --hover: #21252e;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
      --shadow-hover: 0 2px 4px rgba(0, 0, 0, .3), 0 8px 20px rgba(0, 0, 0, .28);
      --shadow-float: 0 16px 48px rgba(0, 0, 0, .55), 0 2px 8px rgba(0, 0, 0, .3);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 var(--sans); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }

  /* Header: navigation on top, tools for the current board underneath. */
  body > header { display: flex; flex-direction: column; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-width: 0; }
  .toolbar { padding: 0 16px 10px; }
  h1 { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 650; letter-spacing: -.01em; margin: 0 4px 0 0; white-space: nowrap; }
  .brand-mark { flex: none; color: var(--accent); }
  .tabs { display: flex; gap: 2px; background: var(--chip); padding: 3px; border-radius: var(--r); }
  .tabs button { border: 0; background: transparent; color: var(--muted); padding: 4px 11px; border-radius: var(--r-sm); cursor: pointer; font: inherit; font-size: 13px; white-space: nowrap; transition: color .12s ease, background-color .12s ease; }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }
  .board-picker { display: flex; align-items: center; gap: 6px; }
  .board-picker select { max-width: 180px; }
  select, input, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 6px 8px; transition: border-color .12s ease, box-shadow .12s ease; }
  select:hover, input:hover, textarea:hover { border-color: var(--muted); }
  ::placeholder { color: var(--muted); opacity: .85; }
  button.primary, button.secondary, button.danger, button.quiet { font: inherit; font-size: 13px; font-weight: 550; border-radius: var(--r-sm); padding: 6px 12px; cursor: pointer; border: 1px solid transparent; transition: background-color .12s ease, border-color .12s ease, color .12s ease; }
  button.primary { background: var(--accent); color: var(--accent-ink); }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button.secondary { background: var(--panel); color: var(--ink); border-color: var(--line-strong); }
  button.secondary:hover:not(:disabled) { background: var(--hover); border-color: var(--muted); }
  button.quiet { display: inline-flex; align-items: center; gap: 6px; background: transparent; color: var(--muted); }
  button.quiet:hover { background: var(--chip); color: var(--ink); }
  button.danger { background: transparent; color: var(--danger); border-color: color-mix(in srgb, var(--danger) 55%, transparent); }
  button.danger:hover:not(:disabled) { background: color-mix(in srgb, var(--danger) 10%, transparent); border-color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  #new-card { display: inline-flex; align-items: center; gap: 6px; }
  .spacer { flex: 1; }
  .status { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .status.error { color: var(--danger); }
  #status { display: inline-flex; align-items: center; gap: 7px; min-width: 0; max-width: min(52vw, 640px); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #status[data-feed]::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  #status[data-feed="live"]::before { width: 13px; height: 13px; background: radial-gradient(circle, var(--ok) 0 3.5px, color-mix(in srgb, var(--ok) 20%, transparent) 3.5px 6.5px); }

  /* Toolbar */
  .filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; flex: 0 1 620px; min-width: 0; }
  .search-field { position: relative; flex: 1 1 280px; min-width: min(260px, 100%); display: flex; align-items: center; }
  .search-field svg { position: absolute; left: 9px; color: var(--muted); pointer-events: none; }
  #search { width: 100%; padding: 5px 30px; background: var(--bg); border-color: var(--line); font-size: 13px; }
  #search:hover { border-color: var(--line-strong); }
  #search:focus { background: var(--panel); }
  #search::-webkit-search-cancel-button { display: none; }
  .search-field kbd { position: absolute; right: 7px; font: 11px/16px var(--mono); padding: 0 5px; color: var(--muted); border: 1px solid var(--line-strong); border-radius: 4px; pointer-events: none; }
  #search:focus ~ kbd, #search:not(:placeholder-shown) ~ kbd { display: none; }
  .filters label { display: inline-flex; gap: 7px; align-items: center; font-size: 13px; color: var(--muted); white-space: nowrap; cursor: pointer; }
  .filters label:hover { color: var(--ink); }
  /* The checkbox, drawn as a switch. */
  .filters label input { appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 28px; height: 16px; margin: 0; padding: 0; border: 0; border-radius: 999px; background: var(--line-strong); cursor: pointer; transition: background-color .15s ease; }
  .filters label input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); transition: transform .15s ease; }
  .filters label input:checked { background: var(--accent); }
  .filters label input:checked::after { transform: translateX(12px); }
  #needs-you { display: inline-flex; align-items: center; gap: 7px; font: inherit; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    color: var(--warn); background: color-mix(in srgb, var(--warn) 13%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); transition: background-color .12s ease; }
  #needs-you:hover { background: color-mix(in srgb, var(--warn) 22%, transparent); }
  #needs-you::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }

  /* Lanes */
  main { display: grid; grid-template-columns: repeat(6, minmax(200px, 1fr)); gap: 10px; padding: 12px 16px 16px; overflow-x: auto; min-height: calc(100vh - 60px); align-items: start; }
  .column { --col: var(--muted); background: var(--lane); border-radius: var(--r-lg); padding: 0 8px 8px; min-height: 120px; }
  .column[data-col="scheduled"] { --col: var(--violet); }
  .column[data-col="queued"] { --col: var(--slate); }
  .column[data-col="running"] { --col: var(--accent); }
  .column[data-col="waiting"] { --col: var(--warn); }
  .column[data-col="done"] { --col: var(--ok); }
  .column[data-col="stopped"] { --col: var(--danger); }
  .column h2 { font-size: 13px; font-weight: 600; color: var(--ink); margin: 0 -8px 2px; padding: 11px 13px 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; background: var(--lane); border-radius: var(--r-lg) var(--r-lg) 0 0; }
  .column h2::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--col); }
  .column h2 span:first-of-type { flex: 1; min-width: 0; }
  .column h2 .col-count { font-size: 12px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
  .column h2 .col-count { order: 2; }
  .drop-action { order: 1; font-size: 11px; color: var(--accent); font-weight: 600; }
  .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 18px 8px; }
  /* A board with no cards at all: one invitation in place of six empty lanes. */
  #columns.board-empty .empty { visibility: hidden; }
  #board-empty { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1; width: min(380px, 86vw); padding: 26px 28px 24px; text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-hover); }
  #board-empty h2 { margin: 0 0 6px; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
  #board-empty p { margin: 0 0 16px; font-size: 13px; color: var(--muted); }
  .show-more { width: 100%; font-size: 12px; }
  /* A worker: its name and state, and a way to what it runs. */
  .worker-chip { display: inline-flex; align-items: center; gap: 5px; padding: 0 7px 0 6px; font: inherit; font-size: 12px; line-height: 18px; color: var(--ink); background: var(--chip); border: 0; border-radius: 999px; cursor: pointer; }
  .worker-chip:hover { color: var(--accent); }
  .worker-chip::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .worker-chip.online::before { background: var(--ok); }
  .worker-chip.offline::before { background: var(--warn); }
  .worker-chip.offline { color: var(--warn); }
  .step-worker { display: inline-flex; align-items: center; gap: 5px; }
  /* Floating layer: overlays.js */
  .tip, .hover-card, .ctx-menu { position: fixed; z-index: 30; margin: 0; }
  .tip { max-width: 300px; padding: 5px 9px; border-radius: var(--r-sm); background: var(--ink); color: var(--bg); font-size: 12px; line-height: 1.4; white-space: pre-line; pointer-events: none; box-shadow: var(--shadow-hover); opacity: 0; transition: opacity .1s ease; }
  .hover-card { width: 300px; padding: 12px 14px; font-size: 12.5px; line-height: 1.45; color: var(--ink); background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--r); box-shadow: var(--shadow-float); pointer-events: none; opacity: 0; transition: opacity .12s ease; overflow-wrap: anywhere; }
  .tip.on, .hover-card.on { opacity: 1; }
  .tip.pinned { z-index: 31; pointer-events: auto; user-select: text; box-shadow: var(--shadow-float); }
  .hover-card strong { font-weight: 650; }
  .hover-card p { margin: 6px 0 0; }
  .hover-card > div > :first-child { margin-top: 0; }
  .hover-card pre { margin-top: 8px; max-height: 96px; overflow: hidden; white-space: pre-wrap; font-size: 11px; }
  .hover-card dl { margin-top: 8px; font-size: 12px; gap: 3px 12px; }
  .hover-card dl:empty { display: none; }
  .hover-card .hover-error { color: var(--danger); white-space: pre-line; }
  .hover-card .hover-note { color: var(--muted); }
  .hover-card .chip { margin-top: 6px; }
  .hover-card code { font: 11px var(--mono); }
  .ctx-menu { min-width: 190px; max-width: 320px; padding: 4px; background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--r); box-shadow: var(--shadow-float); }
  .ctx-item { display: flex; align-items: center; justify-content: space-between; gap: 24px; width: 100%; padding: 6px 9px; font: inherit; font-size: 13px; text-align: left; color: var(--ink); background: transparent; border: 0; border-radius: 5px; cursor: pointer; white-space: nowrap; }
  .ctx-item:focus { outline: none; background: var(--chip); }
  .ctx-item.is-danger { color: var(--danger); }
  .ctx-item.is-danger:focus { background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .ctx-item:disabled { color: var(--muted); opacity: .55; cursor: default; }
  .ctx-item kbd { font: 11px var(--sans); color: var(--muted); }
  .ctx-line { height: 1px; margin: 4px 2px; background: var(--line); }
  /* Drawer: reference details fold away. */
  .drawer-fold > summary { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--muted); }
  .drawer-fold > summary:hover { color: var(--ink); }
  .drawer-fold[open] > summary { margin-bottom: 8px; }
  .hidden-note { color: var(--muted); font-size: 12px; text-align: center; padding: 22px 8px; border: 1px dashed var(--line-strong); border-radius: var(--r); }

  /* Cards */
  .card { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 11px; margin-bottom: 7px; cursor: pointer; box-shadow: var(--shadow); transition: border-color .12s ease, box-shadow .12s ease; }
  /* Big boards: off-screen cards skip layout and paint, so long columns cost about as much as short ones.
     Not on small boards, where cards glide (flip): a card that skips layout measures as its placeholder size. */
  #columns.many .card { content-visibility: auto; contain-intrinsic-size: auto 96px; }
  .card:hover { border-color: var(--line-strong); box-shadow: var(--shadow-hover); }
  .card:focus-visible { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 1px; }
  .card.is-open { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card .title { font-size: 13px; font-weight: 600; line-height: 1.35; letter-spacing: -.003em; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
  .card .last { margin-top: 4px; font-size: 12px; line-height: 1.4; color: var(--muted); overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .card .last.is-error { color: var(--danger); }
  /* The card's hover card has the full story; faces keep one line, or two when it's your move or an error. */
  @media (hover: hover) {
    .card:not(.needs-you) .last:not(.is-error) { -webkit-line-clamp: 1; }
    .column[data-col="done"] .card .last { display: none; }
  }
  .card .meta { margin-top: 8px; color: var(--muted); font-size: 12px; line-height: 1.35; display: flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
  .card .meta .source { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  /* On a card the engine link is a corner icon on hover: the card itself already opens on click. */
  .card .backend-link { position: absolute; top: 6px; right: 6px; margin: 0; width: 24px; height: 24px; justify-content: center; gap: 0; font-size: 0; border-radius: var(--r-sm); background: var(--panel); border: 1px solid var(--line); opacity: 0; transition: opacity .12s ease; }
  .card:hover .backend-link, .card:focus-within .backend-link { opacity: 1; }
  @media (hover: none) { .card .backend-link { position: static; width: auto; height: auto; gap: 4px; margin-top: 6px; font-size: 12px; background: none; border: 0; opacity: 1; } }
  .card .meta .when { flex: none; white-space: nowrap; }
  .card .states { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .card.movable { cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .card.moving { opacity: .6; }
  /* An agent is blocked until a person answers. */
  .card.needs-you { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
  .card.needs-you:hover { border-color: var(--warn); }
  .card.needs-you::before { content: ""; position: absolute; left: -1px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--warn); }
  /* What the card runs. Colour repeats the shape: blue for an agent, violet for a flow, gray for a program. */
  .card-kind { flex: none; display: inline-flex; color: var(--muted); }
  .card-kind.agent { color: var(--accent); }
  .card-kind.flow { color: var(--violet); }
  .card-kind.live { animation: live-pulse 1.8s ease-in-out infinite; }
  @keyframes live-pulse { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .card-kind.live { animation: none; } }
  .chip { display: inline-block; font-size: 11px; font-weight: 550; line-height: 16px; padding: 1px 7px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
  .chip.running { color: var(--accent); background: color-mix(in srgb, var(--accent) 13%, transparent); }
  .chip.waiting, .chip.attention { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
  .chip.done { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
  .chip.stopped { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .chip.scheduled { color: var(--violet); background: color-mix(in srgb, var(--violet) 13%, transparent); }
  .title .chip { margin-left: 2px; vertical-align: 1px; }

  /* Drag and drop */
  .drag-ghost { position: fixed; z-index: 10; margin: 0; pointer-events: none; cursor: grabbing; box-shadow: var(--shadow-float); border-color: var(--accent); will-change: transform; }
  .drop-placeholder { border: 2px dashed var(--accent); border-radius: var(--r); margin-bottom: 7px; background: color-mix(in srgb, var(--accent) 8%, transparent); }
  body.dragging, body.dragging * { cursor: grabbing !important; }
  body.dragging .column { transition: opacity .15s ease, outline-color .15s ease; outline: 2px solid transparent; outline-offset: -2px; }
  body.dragging .column.drop-allowed { outline-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  body.dragging .column.drop-disabled { opacity: .35; }
  body.dragging .card.drop-dim { opacity: .3; filter: grayscale(1); transition: opacity .15s ease; }
  .drop-note { font-size: 11px; color: var(--muted); margin: 6px 4px 0; line-height: 1.35; }
  @media (prefers-reduced-motion: reduce) { body.dragging .column, body.dragging .card.drop-dim { transition: none; } }

  /* Card drawer */
  aside { position: fixed; top: 0; right: 0; width: min(560px, 100vw); height: 100vh; height: 100dvh; background: var(--panel); border-left: 1px solid var(--line); box-shadow: none; transform: translateX(100%); visibility: hidden; transition: transform .2s cubic-bezier(.2, .8, .2, 1), visibility 0s linear .2s; z-index: 3; display: flex; flex-direction: column; }
  aside.open { transform: none; visibility: visible; box-shadow: var(--shadow-float); transition: transform .2s cubic-bezier(.2, .8, .2, 1); }
  @media (prefers-reduced-motion: reduce) { aside, aside.open { transition: none; } }
  aside .head { padding: 14px 16px 14px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
  aside .head .head-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  aside .head h3 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.01em; line-height: 1.3; overflow-wrap: anywhere; }
  #d-state { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  #d-state:empty { display: none; }
  aside .body { padding: 18px 20px 24px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 20px; }
  aside h4 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; font-size: 13px; }
  dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; white-space: pre-line; }
  ol.progress { margin: 0; padding: 10px 12px 10px 34px; background: var(--chip); border-radius: var(--r); font-size: 13px; max-height: 260px; overflow-y: auto; overflow-wrap: anywhere; }
  ol.progress li { padding: 2px 0; }
  ol.progress li::marker { color: var(--muted); font-variant-numeric: tabular-nums; }
  pre { margin: 0; background: var(--chip); border-radius: var(--r); padding: 10px 12px; font: 12px/1.5 var(--mono); overflow: auto; max-height: 220px; }
  pre.is-error { color: var(--danger); background: color-mix(in srgb, var(--danger) 9%, transparent); white-space: pre-wrap; overflow-wrap: anywhere; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row input { flex: 1; min-width: 180px; }

  /* Dialogs */
  dialog { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); color: var(--ink); padding: 22px; width: min(480px, 92vw); box-shadow: var(--shadow-float); }
  dialog::backdrop { background: rgba(10, 13, 20, .5); backdrop-filter: blur(2px); }
  dialog form { display: flex; flex-direction: column; gap: 12px; }
  dialog label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 500; color: var(--ink); }
  dialog label small { font-weight: 400; color: var(--muted); line-height: 1.4; }
  #new-dialog { padding: 0; width: min(520px, 92vw); max-height: min(860px, 92vh); }
  #new-dialog[open] { display: flex; flex-direction: column; }
  #new-form { min-height: 0; flex: 1; padding: 20px 22px 0; overflow-y: auto; scroll-padding-bottom: 72px; }
  .dialog-title { font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
  .dialog-actions { position: sticky; bottom: 0; margin: 4px -22px 0; padding: 12px 22px; display: flex; justify-content: flex-end; gap: 8px; background: var(--panel); border-top: 1px solid var(--line); }
  details.advanced > summary { cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); padding: 2px 0; }
  details.advanced > summary:hover { color: var(--ink); }
  details.advanced[open] > summary { margin-bottom: 10px; }
  details.advanced .advanced-body { display: flex; flex-direction: column; gap: 12px; }
  .close { flex: none; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1; transition: background-color .12s ease, color .12s ease; }
  .close:hover { background: var(--chip); color: var(--ink); }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 8px; }
  .legend svg { vertical-align: middle; margin-right: 4px; }
  .node-panel { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .node-panel h5 { margin: 0; font-size: 14px; }
  #n-flow-fields { display: flex; flex-direction: column; gap: 10px; }
  #n-placement { display: flex; flex-direction: column; gap: 8px; max-height: 40vh; overflow-y: auto; }

  .session-drawer #d-placement { padding: 12px 24px; border-bottom: 1px solid var(--line); }

  /* Desktop: the page itself doesn't scroll. Lanes fill the window and each scrolls on its own,
     so column headers and the toolbar stay put however long a column gets. */
  @media (min-width: 701px) {
    body { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    body > header { flex: none; position: static; }
    main { flex: 1; min-height: 0; align-items: stretch; overflow-y: hidden; }
    .column { min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
    .column h2 { position: sticky; top: 0; z-index: 1; }
  }
  /* Narrower desktops: drop what the controls already say, then let the rows wrap. */
  @media (min-width: 701px) and (max-width: 1200px) {
    .bar { gap: 8px; }

  @media (min-width: 701px) and (max-width: 1040px) {

  }
  /* Phones: one scrollable row of backend tabs, and the columns stacked top to bottom with empty
     ones collapsed to their header, so cards that need you are visible without sideways swiping. */
  @media (max-width: 700px) {
    body > header { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; }
    .bar, .toolbar { display: contents; }

    .board-picker { flex: 1 1 auto; }

    button.quiet { padding: 6px 8px; }
    .filters { order: 4; }
    #needs-you { order: 5; }
    #status { order: 6; margin-left: auto; }
    .tabs { flex: 1 1 100%; overflow-x: auto; scrollbar-width: none; }
    .tabs button { white-space: nowrap; flex: 0 0 auto; }
    main { display: flex; flex-direction: column; align-items: stretch; gap: 8px; padding: 12px; min-height: 0; overflow-x: visible; }

<script>
const COLUMN_LABELS = { scheduled: "Scheduled", queued: "Queued", running: "Running", waiting: "Waiting", done: "Done", stopped: "Stopped / failed" };
const SYSTEM_LABELS = { hatchet: "Hatchet", trigger: "Trigger.dev · production", "trigger-dev": "Trigger.dev · local", prefect: "Prefect", loadtest: "Load test" };
const $ = (id) => document.getElementById(id);
const store = {
  get(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } },
  set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
};

let columns = [];
let systems = [];
let system = null;
let boards = store.get("boards", ["research", "lab-a"]);
let board = store.get("board", boards[0]);
let cards = [];
let flows = [];          // portable flows from the flow host: [{name, description, input, steps, yaml}]
let executionWorkers = [];
const restartWorkers = new Map();

const poolsOf = (w) => w.pools || [w.pool].filter(Boolean);
function workerPicker(label, selected, changed, emptyLabel = 'Use flow selection') {
  const select = el('select', { 'aria-label': label });
  const choices = [[emptyLabel, {}], ...[...new Set(executionWorkers.flatMap(poolsOf))].map(pool => [`Pool: ${pool}`, {pool}]),
    ...executionWorkers.map(w => [`Worker: ${w.id} · ${poolsOf(w).join(', ')} · ${(w.tags || []).join(', ')}${w.online ? '' : ' (offline)'}`, {id:w.id}])];
  const route = selected || {};
  for (const [text, value] of choices) select.append(el('option', {value: JSON.stringify(value)}, text));
  const base = route.id ? {id:route.id} : route.pool ? {pool:route.pool} : {};
  if (![...select.options].some(o => o.value === JSON.stringify(base))) select.append(el('option', {value:JSON.stringify(base)}, JSON.stringify(base)));
  select.value = JSON.stringify(base);
  const tags = el('input', {placeholder:'Required tags, separated by commas', value:(route.tags || []).join(', '), 'aria-label': `${label} tags`});
  const read = () => ({...JSON.parse(select.value), ...(tags.value.trim() ? {tags:tags.value.split(',').map(t=>t.trim()).filter(Boolean)} : {})});
  select.addEventListener('change', () => changed(read()));
  tags.addEventListener('input', () => changed(read()));
  return el('label', {}, label, select, tags);
}

let newCard = null;      // the New card form (new-card.js), mounted below
let schedules = [];     // this board's cards that start later or repeat
let openCardId = null;
const contextKey = () => `${system}/${board}`;
const runKey = () => `${contextKey()}/${openCardId}`;
const chat = AgentChat.mount($("d-chat"), { el, input: async (body) => {
  const key = runKey(), currentSystem = system, id = openCardId;
  await api("POST", `/api/cards/${currentSystem}/${encodeURIComponent(id)}/input`, body);
}, loadOlder: async (before) => {
  // Bound now: by the time the page arrives the user may be on another card.
  const path = `/api/cards/${system}/${encodeURIComponent(openCardId)}/transcript?limit=100&before=${encodeURIComponent(before)}`;
  return api("GET", path);
} });

async function api(method, path, body) {
  const response = await fetch(path, {
    method, headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}

// A length of time in the largest units that matter: 42s, 7m, 3h 12m, 2d 5h.
function span(seconds) {
  const s = Math.max(0, Math.round(seconds));
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60);
  if (h < 24) return m % 60 ? `${h}h ${m % 60}m` : `${h}h`;
  const d = Math.floor(h / 24);
  return h % 24 ? `${d}d ${h % 24}h` : `${d}d`;
}

function ago(iso) {
  return iso ? span((Date.now() - new Date(iso)) / 1000) : "";
}

function queueText(card) {
  const q = card.queue || {};
  const parts = [];
  if (card.column === "queued" && q.ahead != null) parts.push(q.ahead === 0 ? "next up" : `${q.ahead} ahead`);
  if (q.running != null) parts.push(`${q.running} running${q.limit ? ` / limit ${q.limit}` : ""}`);
  if (q.queued != null) parts.push(`${q.queued} queued`);
  if (q.paused) parts.push("queue PAUSED");
  return parts.join(" · ");
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v; else if (k.startsWith("on")) node.addEventListener(k.slice(2), v); else node.setAttribute(k, v);
  }
  for (const child of children) if (child != null) node.append(child);
  return node;
}

function renderHeader() {
  $("systems").replaceChildren(...systems.map((s) =>
    el("button", { type: "button", "aria-pressed": String(s === system), onclick: () => { system = s; store.set("system", s); closeDrawer(); cards = []; schedules = []; shownLimit = {}; renderBoard(); refresh(); loadSchedules(); renderHeader(); } }, SYSTEM_LABELS[s] || s)));
  $("board").replaceChildren(...boards.map((b) => { const o = el("option", { value: b }, b); if (b === board) o.selected = true; return o; }));
  updateNewForm();
}

// Top of a column = what the engine runs first (Queued/Scheduled, by card.order), oldest running
// first, newest finished first. Same rule as board/moves.py. Timestamps are ISO strings, which
// compare correctly as plain strings (and far faster than localeCompare on big boards).
const cmp = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
function columnOrder(a, b) {
  if (a.column === "queued" || a.column === "scheduled") return (a.order ?? 0) - (b.order ?? 0) || cmp(a.created_at || "", b.created_at || "");
  if (a.column === "running" || a.column === "waiting") return cmp(a.started_at || a.created_at || "", b.started_at || b.created_at || "") || cmp(a.created_at || "", b.created_at || "");
  return cmp(b.finished_at || b.created_at || "", a.finished_at || a.created_at || "") || cmp(a.created_at || "", b.created_at || "");
}

// ---------------------------------------------------------------- Filtering
// The search box filters with CardSearch (card-search.js); "Hide done / failed" empties those
// columns but keeps them as drop targets. Search covers every card; only the rendering is paged:
// columns render PAGE cards at a time, so a board of thousands of runs stays responsive.
const PAGE = 50;
const FLIP_MAX = 150;          // above this many cards on screen, skip the glide animation (see #columns.many in the CSS)
const FINISHED = new Set(["done", "stopped"]);
let query = "";
let hideFinished = store.get("hideFinished", false);
let shownLimit = {};           // column -> cards rendered (PAGE more per "Show more")
let filtered = { cards: null, query: "", hits: [] };
let renderedCount = 0;
let loadedContext = null;      // the backend/board whose first snapshot has arrived

function filteredCards() {
  if (filtered.cards === cards && filtered.query === query) return filtered.hits;
  // Typing further only narrows: filter the previous hits instead of every card.
  const from = filtered.cards === cards && CardSearch.narrows(filtered.query, query) ? filtered.hits : cards;
  filtered = { cards, query, hits: CardSearch.filter(from, query) };
  return filtered.hits;
}

let renderQueued = false;
function renderSoon() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; renderBoard(); if (columns.length) liveStatus(); });
}

// Build the search index of new and changed cards while the browser is idle, so the first
// keystroke doesn't pay for it.
let indexing = null;
function indexSoon() {
  if (indexing || typeof requestIdleCallback !== "function") return;
  let at = 0, list = cards;
  const step = (deadline) => {
    if (list !== cards) { at = 0; list = cards; }
    while (at < list.length && deadline.timeRemaining() > 2) for (const end = Math.min(at + 200, list.length); at < end; at++) CardSearch.index(list[at]);
    indexing = at < list.length ? requestIdleCallback(step) : null;
  };
  indexing = requestIdleCallback(step);
}

function renderBoard() {
  if (drag) { drag.renderPending = true; return; } // don't pull cards from under the pointer
  const before = renderedCount <= FLIP_MAX ? cardRects() : new Map();
  const hits = filteredCards(), total = {}, byColumn = {};
  for (const col of columns) { total[col] = 0; byColumn[col] = []; }
  for (const c of cards) if (c.column in total) total[c.column]++;
  for (const c of hits) byColumn[c.column]?.push(c);
  renderedCount = 0;
  // Lanes are rebuilt on every update; each keeps its place, or live updates would throw you back to the top.
  const scrolled = new Map([...$("columns").children].map((lane) => [lane.dataset.col, lane.scrollTop]));
  $("columns").replaceChildren(...columns.map((col) => {
    const inCol = byColumn[col], hidden = hideFinished && FINISHED.has(col);
    const shown = hidden ? [] : inCol.sort(columnOrder).slice(0, shownLimit[col] || PAGE);
    renderedCount += shown.length;
    const rest = inCol.length - shown.length;
    const planned = col === "scheduled" ? schedules.filter((s) => !query || s.title.toLowerCase().includes(query.toLowerCase())) : [];
    const count = query ? `${inCol.length + planned.length} / ${total[col] + (col === "scheduled" ? schedules.length : 0)}` : String(inCol.length + planned.length);
    sortedColumns[col] = hidden ? [] : inCol;
    const more = !hidden && rest > 0 ? moreButton(col, rest) : null;
    const note = hidden && inCol.length ? el("div", { class: "hidden-note" }, `${inCol.length} hidden`)
      : !inCol.length && !planned.length ? el("div", { class: "empty" }, query && total[col] ? "No matches" : loadedContext === contextKey() ? "Nothing here" : "Loading…") : null;
    return el("section", { class: shown.length || planned.length ? "column" : "column is-empty", "aria-label": COLUMN_LABELS[col], "data-col": col },
      el("h2", {}, el("span", {}, COLUMN_LABELS[col]), el("span", { class: "col-count" }, count)), ...planned.map((s) => NewCard.scheduleNode(s, scheduleActions)), ...shown.map(cardNode), more, note);
  }));
  for (const lane of $("columns").children) lane.scrollTop = scrolled.get(lane.dataset.col) || 0;
  $("columns").classList.toggle("many", renderedCount > FLIP_MAX);
  if (renderedCount <= FLIP_MAX) flip(before);
  moreObserver?.disconnect();
  document.querySelectorAll("#columns .show-more").forEach((b) => moreObserver?.observe(b));
  markOpenCard();
  renderNeedsYou();
  // Only once the board's first snapshot has arrived: until then "no cards" just means "not loaded".
  const empty = cards.length === 0 && schedules.length === 0 && loadedContext === contextKey();
  $("board-empty").hidden = !empty;
  $("columns").classList.toggle("board-empty", empty);
}

// Scrolling near the end of a column loads its next page; the button remains a fallback.
const sortedColumns = {};      // column -> its filtered, sorted cards as last rendered
const moreObserver = typeof IntersectionObserver === "function" ? new IntersectionObserver((entries) => {
  for (const entry of entries) if (entry.isIntersecting) loadMore(entry.target.dataset.col);
}, { rootMargin: "0px 0px 800px 0px", scrollMargin: "0px 0px 800px 0px" }) : null; // rootMargin: page scroll (phones); scrollMargin: a lane's own scroll (desktop)

function moreButton(col, rest) {
  return el("button", { type: "button", class: "secondary show-more", "data-col": col, onclick: () => loadMore(col) },
    `Show ${Math.min(PAGE, rest)} more · ${rest} not shown`);
}

// Appends the column's next page in place: no re-render of the board.
function loadMore(col) {
  const list = sortedColumns[col], button = document.querySelector(`#columns .show-more[data-col="${col}"]`);
  if (drag || !list || !button) return;
  const from = shownLimit[col] || PAGE, to = Math.min(from + PAGE, list.length);
  shownLimit[col] = from + PAGE;
  button.before(...list.slice(from, to).map(cardNode));
  renderedCount += to - from;
  $("columns").classList.toggle("many", renderedCount > FLIP_MAX);
  moreObserver?.unobserve(button);
  if (to < list.length) {
    const next = moreButton(col, list.length - to);
    button.replaceWith(next);
    moreObserver?.observe(next);
  } else button.remove();
}

$("hide-finished").checked = hideFinished;
$("hide-finished").addEventListener("change", (e) => { hideFinished = e.target.checked; store.set("hideFinished", hideFinished); renderSoon(); });
$("search").addEventListener("input", (e) => { query = e.target.value; shownLimit = {}; renderSoon(); });
$("search").addEventListener("keydown", (e) => {

});
document.addEventListener("keydown", (e) => {

// ---------------------------------------------------------------- Drag and drop
// Cards move only where the engine has a matching action (card.moves, from board/moves.py):
// target column -> reorder | restart | start_now | cancel | stop | mark_done | continue.
const MOVE_LABELS = { reorder: "Change priority", restart: "Run again", start_now: "Start now", cancel: "Cancel run",
  stop: "Stop gracefully", mark_done: "Mark done", continue: "Continue" };
let drag = null;              // the drag in progress
let suppressClick = false;    // a drag ends with a click on the card; don't open it
const movingIds = new Set();  // cards whose move request is in flight

function dragStart(event, card) {
  if (event.button !== 0 || event.target.closest("a, button, input, textarea, select")) return;
  const node = event.currentTarget, touch = event.pointerType === "touch";
  const pending = { card, node, x: event.clientX, y: event.clientY, pointerId: event.pointerId, started: false };
  // Touch: hold briefly to drag, so swiping still scrolls the board. Mouse/pen: move a few pixels.
  const timer = touch ? setTimeout(() => begin(), 280) : null;
  const begin = () => {
    if (pending.started) return;
    pending.started = true;
    beginDrag(pending);
  };
  const move = (e) => {
    if (e.pointerId !== pending.pointerId) return;
    if (!pending.started) {
      if (Math.hypot(e.clientX - pending.x, e.clientY - pending.y) < 6) return;
      if (touch) { cleanup(); return; } // moved before the hold: it's a scroll
      begin();
    }
    e.preventDefault();
    dragMove(e.clientX, e.clientY);
  };
  const up = (e) => { if (e.pointerId !== pending.pointerId) return; cleanup(); if (pending.started) dragEnd(e.type === "pointercancel"); };
  const key = (e) => { if (e.key === "Escape" && pending.started) { cleanup(); dragEnd(true); } };
  const cleanup = () => {
    clearTimeout(timer);
    removeEventListener("pointermove", move); removeEventListener("pointerup", up); removeEventListener("pointercancel", up);
    removeEventListener("keydown", key);
  };
  addEventListener("pointermove", move, { passive: false });
  addEventListener("pointerup", up); addEventListener("pointercancel", up); addEventListener("keydown", key);
}

function beginDrag(pending) {
  const { card, node } = pending, rect = node.getBoundingClientRect();
  const ghost = node.cloneNode(true);
  ghost.classList.add("drag-ghost");
  ghost.classList.remove("is-open");
  Object.assign(ghost.style, { width: `${rect.width}px`, left: `${rect.left}px`, top: `${rect.top}px` });
  document.body.append(ghost);
  const placeholder = el("div", { class: "drop-placeholder", style: `height:${rect.height}px` });
  node.replaceWith(placeholder);
  drag = { card, ghost, placeholder, dx: pending.x - rect.left, dy: pending.y - rect.top, target: card.column, renderPending: false };
  document.body.classList.add("dragging");
  for (const section of document.querySelectorAll("#columns .column")) {
    const action = card.moves[section.dataset.col];
    section.classList.toggle("drop-allowed", !!action);
    section.classList.toggle("drop-disabled", !action);
    if (action) section.querySelector("h2").append(el("span", { class: "drop-action" }, MOVE_LABELS[action] || action));
    // A run that already started can only be restarted at the top (high priority) or bottom (low).
    if (action === "restart") {
      section.classList.add("ends-only");
      section.append(el("p", { class: "drop-note" }, card.system.startsWith("trigger") ? card.reorder_note
        : "Starts again as a new run: drop at the top for high priority, at the bottom for low."));
    } else if (action === "reorder" && card.reorder_note) section.append(el("p", { class: "drop-note" }, card.reorder_note));
  }
  dragMove(pending.x, pending.y);
  requestAnimationFrame(dragAutoScroll);
}

// Holding a dragged card near the edge of a lane scrolls it, so any position can be reached.
function dragAutoScroll() {
  if (!drag) return;
  const EDGE = 56, SPEED = 12, { x, y } = drag.pointer, lanes = $("columns");
  const scrollBy = (node, delta) => { const before = node.scrollLeft + node.scrollTop; node.scrollBy(delta); return node.scrollLeft + node.scrollTop !== before; };
  const lane = document.elementsFromPoint(x, y).map((n) => n.closest?.("#columns .column")).find(Boolean);
  const box = lane?.getBoundingClientRect(), wide = lanes.getBoundingClientRect();
  const down = box ? (y > box.bottom - EDGE ? SPEED : y < box.top + EDGE ? -SPEED : 0) : 0;
  const across = x > wide.right - EDGE ? SPEED : x < wide.left + EDGE ? -SPEED : 0;
  const moved = (down && scrollBy(lane, { top: down })) | (across && scrollBy(lanes, { left: across }));
  if (moved) dragMove(x, y);
  requestAnimationFrame(dragAutoScroll);
}

function dragMove(x, y) {
  drag.pointer = { x, y };
  const { ghost, placeholder, dx, dy, card } = drag;
  ghost.style.transform = `translate(${x - dx - parseFloat(ghost.style.left)}px, ${y - dy - parseFloat(ghost.style.top)}px) rotate(1.5deg)`;
  const section = document.elementsFromPoint(x, y).map((n) => n.closest?.("#columns .column")).find(Boolean);
  const to = section?.dataset.col;
  if (!section || !card.moves[to]) { drag.target = null; return; }
  drag.target = to;
  const others = [...section.querySelectorAll(".card[data-id]")];
  let index = others.findIndex((n) => { const r = n.getBoundingClientRect(); return y < r.top + r.height / 2; });
  if (index < 0) index = others.length;
  // Started runs: only the ends of Queued; non-priority columns: always on top.
  if (card.moves[to] === "restart") index = index <= others.length / 2 ? 0 : others.length;
  else if (!["reorder", "restart"].includes(card.moves[to])) index = 0;
  others.forEach((n, i) => n.classList.toggle("drop-dim", card.moves[to] === "restart" && i > 0 && i < others.length - 1 && others.length > 1));
  const next = others[index] || section.querySelector(".drop-note") || null;
  if (placeholder.parentNode === section && placeholder.nextElementSibling === next) return;
  const before = cardRects();
  section.querySelector(".empty")?.setAttribute("hidden", "");
  if (next) next.before(placeholder); else section.append(placeholder);
  flip(before);
}

async function dragEnd(cancelled) {
  const { card, ghost, placeholder, target } = drag;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
  const action = !cancelled && target ? card.moves[target] : null;
  const section = placeholder.parentNode?.closest?.(".column");
  const ids = section ? [...section.querySelectorAll(".card[data-id], .drop-placeholder")].map((n) => n.dataset?.id || "*") : [];
  const at = ids.indexOf("*");
  const above = at > 0 ? ids[at - 1] : null, below = at >= 0 && at < ids.length - 1 ? ids[at + 1] : null;
  const unchanged = target === card.column && action === "reorder" && neighbours(card) === `${above}|${below}`;
  const confirmed = !action || unchanged || confirmMove(card, action);
  // Glide the card to where it lands (or back), then hand the board back to live updates.
  const home = (action && confirmed && !unchanged ? placeholder : null)?.getBoundingClientRect();
  if (home && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    ghost.style.transition = "transform .18s cubic-bezier(.2,.8,.2,1)";
    ghost.style.transform = `translate(${home.left - parseFloat(ghost.style.left)}px, ${home.top - parseFloat(ghost.style.top)}px)`;
    await new Promise((r) => setTimeout(r, 180));
  }
  ghost.remove();
  document.body.classList.remove("dragging");
  document.querySelectorAll(".drop-action, .drop-note").forEach((n) => n.remove());
  document.querySelectorAll(".drop-dim").forEach((n) => n.classList.remove("drop-dim")); // card nodes are reused
  drag = null;
  if (action && confirmed && !unchanged) await sendMove(card, target, action, above, below);
  else renderBoard();
}

// A move that stops running work asks first, however it was started.
function confirmMove(card, action) {
  const destructive = action === "cancel" || (action === "restart" && ["running", "waiting"].includes(card.column));
  return !destructive || confirm(action === "cancel" ? `Cancel "${card.title}"? The engine stops it now.` : `Stop "${card.title}" and run it again from the start?`);
}
function runMove(card, target, action, above, below) {
  if (confirmMove(card, action)) sendMove(card, target, action, above, below);
}
async function sendMove(card, target, action, above, below) {
  // Optimistic: show the card in its new column until the engine reports back.
  const key = contextKey(), local = cards.find((c) => c.id === card.id);
  if (local && ["reorder", "restart", "start_now"].includes(action)) local.column = target === "scheduled" ? "scheduled" : "queued";
  if (local && action === "reorder") local.order = estimateOrder(target, above, below);
  movingIds.add(card.id);
  renderBoard();
  try {
    setStatus(`${MOVE_LABELS[action]}…`);
    const result = await api("POST", `/api/cards/${system}/${encodeURIComponent(card.id)}/move`, { board, to: target, above, below });
    setStatus(result.id !== card.id ? `${MOVE_LABELS[action]}: started as a new run` : `${MOVE_LABELS[action]}: done`);
    if (openCardId === card.id && result.id !== card.id) openCardId = result.id;
  } catch (e) { setStatus(e.message, true); }
  finally { movingIds.delete(card.id); if (key === contextKey()) await refresh(); }
}

function neighbours(card) {
  const col = cards.filter((c) => c.column === card.column).sort(columnOrder), i = col.findIndex((c) => c.id === card.id);
  return `${col[i - 1]?.id ?? null}|${col[i + 1]?.id ?? null}`;
}

function estimateOrder(column, above, below) {
  const order = (id) => cards.find((c) => c.id === id)?.order;
  const a = above ? order(above) : null, b = below ? order(below) : null;
  return a != null && b != null ? (a + b) / 2 : b != null ? b - 1 : a != null ? a + 1 : 0;
}

// FLIP: cards that changed place glide from where they were instead of jumping.
function cardRects() {
  return new Map([...document.querySelectorAll("#columns .card[data-id]")].map((n) => [n.dataset.id, n.getBoundingClientRect()]));
}
function flip(before, except = null) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (const node of document.querySelectorAll("#columns .card[data-id]")) {
    const was = before.get(node.dataset.id);
    if (!was || node === except) continue;
    const now = node.getBoundingClientRect(), dx = was.left - now.left, dy = was.top - now.top;
    if (!dx && !dy) continue;
    node.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }], { duration: 220, easing: "cubic-bezier(.2,.8,.2,1)" });
  }
}

// A card's element is reused until the card changes (a new object from the live stream) or its
// face text does (the "running 3m" clock), so re-rendering a big board mostly moves nodes.
const cardNodes = new WeakMap(); // card -> { face, node }
function cardNode(card) {
  const when = card.column === "queued" || card.column === "scheduled" ? ago(card.created_at) : card.finished_at ? duration(card) : ago(card.started_at);
  const face = `${when}|${movingIds.has(card.id)}|${connection(card).state}`;
  const known = cardNodes.get(card);
  if (known?.face === face) return known.node;
  const node = renderCard(card, when);
  cardNodes.set(card, { face, node });
  return node;
}

// Sessions blocked until a person acts, and how to say so on a card.
const NEEDS_YOU = { approval: "Needs approval", question: "Has a question", awaiting_review: "Ready for review", awaiting_input: "Needs direction", stuck: "Stuck" };
const SESSION_LABELS = { starting: "Starting", retrying: "Retrying" };
const WHEN_LABELS = { scheduled: "Waiting for", queued: "Waiting for", running: "Running for", waiting: "Open for", done: "Took", stopped: "Took" };
const needsYou = (card) => !FINISHED.has(card.column) && card.session_state in NEEDS_YOU && connection(card).state !== "offline";
// Engine statuses that only repeat the column a card is already in, so the card doesn't show them.
const PLAIN_STATUS = { scheduled: ["scheduled"], queued: ["queued", "pending"], running: ["running", "executing"], waiting: ["waiting", "paused"],
  done: ["completed", "completed_successfully", "succeeded", "success", "done"], stopped: [] };
const statusWords = (status) => { const s = String(status || "").replaceAll("_", " ").toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); };

function stateChip(card) {
  const link = connection(card);
  if (link.state === "offline") return el("span", { class: "chip attention", title: `${link.worker} is offline, so this can't be live` }, "Worker offline");
  if (link.state === "unknown") return el("span", { class: "chip", title: `Can't check ${link.worker}, so this may not be live` }, "Connection unknown");
  if (needsYou(card)) return el("span", { class: "chip attention" }, NEEDS_YOU[card.session_state]);
  if (card.session_state in SESSION_LABELS) return el("span", { class: `chip ${card.column}` }, SESSION_LABELS[card.session_state]);
  if (card.session_state || !card.status || PLAIN_STATUS[card.column]?.includes(card.status.toLowerCase())) return null;
  if (card.error && card.status.toLowerCase() === "failed") return null; // the error, in red, already says so
  return el("span", { class: `chip ${card.column}` }, statusWords(card.status));
}

// Where a queued card stands. The queue's totals are the same for every card, so they live in the drawer.
function queuePosition(card) {
  const q = card.queue || {};
  if (card.column !== "queued") return "";
  return [q.ahead == null ? "" : q.ahead === 0 ? "next up" : `${q.ahead} ahead`, q.paused ? "queue PAUSED" : ""].filter(Boolean).join(" · ");
}

// What a card runs, with the same icons as steps in the graph: a flow, an agent, or a program.
const cardKind = (card) => (card.flow || card.task === "research-report" ? "flow" : card.agent || card.task === "agent-session" || card.task === "steerable-agent" ? "agent" : "program");
const KIND_WORDS = { flow: "Flow", agent: "Agent", program: "Program" };
function kindIcon(card) {
  const kind = cardKind(card);
  return el("span", { class: `card-kind ${kind}${card.column === "running" && connection(card).state === "live" ? " live" : ""}`, role: "img", "aria-label": KIND_WORDS[kind] },
    svg("svg", { width: 14, height: 14, viewBox: FlowGraph.ICON_BOX, fill: "none", stroke: "currentColor", "stroke-width": 1.5, "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" }, svg("path", { d: FlowGraph.ICONS[kind] })));
}
// The icon says it's a flow, so the name needn't.
const sourceName = (card) => card.flow || (card.agent === "demo" ? "Demo · simulated" : card.agent === "program" ? "Program" : card.agent || card.task);

function renderCard(card, when) {
  const workers = [...new Set((card.workers || []).map((w) => w.id))];
  const whenLabel = WHEN_LABELS[card.column] || "For";
  const movable = Object.keys(card.moves || {}).length > 0;
  const priority = card.column === "queued" && card.system === "hatchet" && card.priority ? el("span", { class: "chip", title: "Hatchet priority (1 low – 3 high)" }, `P${card.priority}`) : null;
  const chip = stateChip(card), q = queuePosition(card);
  // What happened most recently; for a failed run, why it failed.
  const detail = (card.column === "stopped" && card.error) || card.last;
  const name = sourceName(card);
  // One line: who is doing it and (right-aligned) for how long. Everything else is in the hover card.
  const where = workers.length ? `${workers[0]}${workers.length > 1 ? ` +${workers.length - 1}` : ""}` : "";
  const who = [name, where, q].filter(Boolean).join(" · ");
  return el("div", { class: `card${movable ? " movable" : ""}${movingIds.has(card.id) ? " moving" : ""}${needsYou(card) ? " needs-you" : ""}`, tabindex: "0", role: "button", "data-id": card.id,
      "aria-roledescription": movable ? "draggable card" : "card",
      onclick: (e) => { if (!suppressClick) openCard(card.id); }, onkeydown: (e) => { if (e.key === "Enter") openCard(card.id); },
      onpointerdown: movable ? (e) => dragStart(e, card) : null },
    el("div", { class: "title" }, card.title, priority ? " " : null, priority),
    chip ? el("div", { class: "states" }, chip) : null,
    detail ? el("div", { class: `last${detail === card.error ? " is-error" : ""}` }, detail) : null,
    el("div", { class: "meta" },
      kindIcon(card),
      el("span", { class: "source" }, who),
      when ? el("span", { class: "when", "aria-label": `${whenLabel} ${when}` }, when) : null),
    backendLink(card.backend_url));
}

// ---------------------------------------------------------------- Hover card and right click
const cardById = (id) => cards.find((c) => c.id === id);
function cardDetails(card) {
  const row = (name, value) => (value ? [el("dt", {}, name), el("dd", {}, value)] : []);
  const workers = uniqueWorkers(card).map((id) => `${id} · ${WORKER_WORDS[workerState(id)]}`).join("\n");
  const detail = card.error || card.last;
  const running = WHEN_LABELS[card.column] && (card.finished_at ? duration(card) : card.started_at ? ago(card.started_at) : ago(card.created_at));
  return el("div", {}, el("strong", {}, card.title),
    detail ? el("p", { class: card.error ? "hover-error" : "" }, detail) : null,
    el("dl", {}, ...row(KIND_WORDS[cardKind(card)], sourceName(card)),
      ...row("Workers", workers), ...row(WHEN_LABELS[card.column]?.replace(" for", "") || "Time", running),
      ...row("Queue", queueText(card)), ...row("Created", AgentChat.localTime(card.created_at))));
}
Overlays.hoverCard($("columns"), ".card[data-id]", (node) => {
  const card = cardById(node.dataset.id);
  return card && !drag ? cardDetails(card) : null;
});

function copyText(text, what) {
  navigator.clipboard.writeText(text).then(() => setStatus(`Copied ${what}`), () => setStatus("Copy failed", true));
}
function setFilter(text) {
  const box = $("search");
  box.value = text; query = text; shownLimit = {}; renderSoon();
}
// The moves the engine allows for this card, the same ones as dragging it.
function moveItems(card) {
  const items = [];
  const others = (col) => cards.filter((c) => c.column === col && c.id !== card.id).sort(columnOrder);
  for (const [target, action] of Object.entries(card.moves || {})) {
    const inColumn = others(target);
    const first = inColumn[0]?.id ?? null, last = inColumn.at(-1)?.id ?? null;
    if (action === "reorder") {
      const order = [...inColumn, card].sort(columnOrder), at = order.indexOf(card);
      items.push({ label: "Move to top", disabled: at === 0, onSelect: () => runMove(card, target, action, null, first) });
      items.push({ label: "Move to bottom", disabled: at === order.length - 1, onSelect: () => runMove(card, target, action, last, null) });
    } else {
      const label = action === "restart" ? "Run again" : MOVE_LABELS[action] || action;
      items.push({ label, danger: action === "cancel", onSelect: () => runMove(card, target, action, action === "restart" ? last : null, null) });
    }

  return items.sort((a, b) => Number(!!a.danger) - Number(!!b.danger));
}
function cardMenu(event, card) {
  const moves = moveItems(card), worker = card.workers?.[0]?.id;
  const url = /^https?:\/\//.test(card.backend_url || "") ? card.backend_url : null;
  const copy = !navigator.clipboard;
  Overlays.menu(event, [
    { label: "Open", shortcut: "Enter", onSelect: () => openCard(card.id) },
    url ? { label: `Open in ${SYSTEM_LABELS[system].split(" · ")[0]}`, onSelect: () => window.open(url, "_blank", "noopener,noreferrer") } : undefined,
    ...(moves.length ? [null, ...moves] : []), null,
    card.agent ? { label: `Only ${card.agent === "demo" ? "demo" : card.agent} cards`, onSelect: () => setFilter(`agent:${card.agent}`) } : undefined,
    worker ? { label: `Only cards on ${worker}`, onSelect: () => setFilter(`worker:${worker}`) } : undefined,
    { label: "Copy title", disabled: copy, onSelect: () => copyText(card.title, "the title") },
    { label: "Copy run ID", disabled: copy, onSelect: () => copyText(card.id, "the run ID") },
  ].filter((item) => item !== undefined));
}
function laneMenu(event) {
  Overlays.menu(event, [{ label: "New card", onSelect: () => $("new-card").click() }, null,
    { label: hideFinished ? "Show done / failed" : "Hide done / failed", onSelect: () => $("hide-finished").click() },
    { label: "Clear filter", disabled: !query, onSelect: () => setFilter("") }]);
}
$("columns").addEventListener("contextmenu", (e) => {
  if (e.pointerType === "touch" || e.target.closest("a, input, textarea, select")) return;
  e.preventDefault();
  if (drag) return;
  const node = e.target.closest(".card[data-id]"), card = node && cardById(node.dataset.id);
  if (card) cardMenu(e, card); else laneMenu(e);
});

// Show which card the drawer belongs to. Card nodes are reused, so this runs after every render.
function markOpenCard() {
  document.querySelector("#columns .card.is-open")?.classList.remove("is-open");
  if (openCardId != null) document.querySelector(`#columns .card[data-id="${CSS.escape(openCardId)}"]`)?.classList.add("is-open");
}

// The cards waiting on a person, oldest first; the toolbar button walks through them.
function waitingOnYou() {
  return cards.filter(needsYou).sort((a, b) => cmp(a.started_at || a.created_at || "", b.started_at || b.created_at || ""));
}
function renderNeedsYou() {
  const n = waitingOnYou().length, button = $("needs-you");
  button.hidden = !n;
  button.textContent = n === 1 ? "1 needs you" : `${n} need you`;
}
$("empty-new-card").addEventListener("click", () => $("new-card").click());
$("needs-you").addEventListener("click", () => {
  const list = waitingOnYou();
  if (!list.length) return;
  openCard(list[(list.findIndex((c) => c.id === openCardId) + 1) % list.length].id);
});

function backendLink(url) {
  if (!url || !/^https?:\/\//.test(url)) return null;
  return el("a", { class: "backend-link", href: url, target: "_blank", rel: "noopener noreferrer",
    onclick: (e) => e.stopPropagation(), onkeydown: (e) => e.stopPropagation() },
    `Open in ${SYSTEM_LABELS[system].split(" · ")[0]} `,
    svg("svg", { width: 14, height: 14, viewBox: "0 0 24 24", "aria-hidden": "true", fill: "none", stroke: "currentColor", "stroke-width": 1.7 },
      svg("path", { d: "M14 3h7v7m0-7L10 14M10 3H3v18h18v-7" })));
}

function duration(card) {
  if (!card.started_at || !card.finished_at) return "";
  return span((new Date(card.finished_at) - new Date(card.started_at)) / 1000);
}

// ---- Back gesture / Back button closes the open overlay instead of leaving the board.
// Each overlay that opens pushes one history entry; Back (Android gesture, iOS edge swipe, the
// browser button) pops it and closes the overlay. Closing with ✕/Escape removes that entry

    const extra = removed.filter(entry => entry.pushed).length;
    if (!extra) return;
    // history.go(-N) emits ONE popstate, even when it crosses several overlay entries.
    ignoredPops++;

// ---------------------------------------------------------------- Fleet placement, live
// A placed card or flow step waits inside its engine task for a fleet worker; the engine shows it

  const key = placeable ? runKey() : null;

}

    }

    : ids.length ? [el("ul", { class: "placement-steps" }, ...ids.map((sid) => el("li", { "data-step": sid }, FlowBuilder.executionView(steps[sid], { label: sid }))))] : [];

const SVG_NS = "http://www.w3.org/2000/svg";
let dag = null;          // {model, nodes, edges} for the open card
let selectedNode = null; // node id

// A log list that starts at the newest lines and loads older pages when scrolled to the top.
// The server pushes new lines for the open card; node logs catch up with `?after=`.
function pagedLines(list, options) {

    stick: true, top: 0 };

    state.stick = list.scrollTop + list.clientHeight >= list.scrollHeight - 4; state.top = list.scrollTop;
    if (list.scrollTop < 60) loadOlder();

// ---------------------------------------------------------------- A run's graph
// The same viewer as the flow editor (flow-graph.js), with a run's data and a run's actions: looking
// at what happened and acting on the run. Nothing here can change the flow itself; "Edit this flow" goes there.
const GRAPH_TITLES = { declared: ["Flow graph", "Dependencies the engine enforces"], dataflow: ["Task graph", "Data dependencies recorded by Prefect"] };

function runGraphViewer() {

// A portable flow appears where its author placed it, if the editor's layout covers every step.
async function loadFlowLayout(name) {
  if (flowLayouts.has(name)) return;
  flowLayouts.set(name, null);
  try {
    const data = await api("GET", `/api/flow-documents/${encodeURIComponent(name)}`);
    if (data.layout?.positions) { flowLayouts.set(name, data.layout.positions); runGraphShape = null; renderDag(); }

  const worker = stepWorkerOf(n);
  if (worker && !["done", "stopped"].includes(n.column) && workerState(worker) === "offline") return { placing: false, status: "worker offline", state: "waiting", worker, offline: true };
  // The engine reports a placed step as running while it still waits for a fleet worker.
  const placing = !["done", "stopped"].includes(n.column) && ["queued", "waiting"].includes(n.execution?.state) && !n.execution.worker;
  const status = !placing ? n.status.toLowerCase() : n.execution.intervention_needed ? "intervention needed" : n.execution.state === "waiting" ? "waiting for a worker" : "queued for a worker";

function renderDag() {
  const section = $("d-dag-section");
  if (!dag || !dag.nodes.length || (dag.nodes.length < 2 && !dag.nodes[0].kind)) { section.hidden = true; return; }
  section.hidden = false;
  const [title, about] = GRAPH_TITLES[dag.model] || ["Run graph", "Child runs and the order they ran in"];
  $("d-dag-title").textContent = title;
  $("d-dag-title").title = about;
  const flow = cards.find((c) => c.id === openCardId)?.flow;
  if (flow) loadFlowLayout(flow);
  const graph = runGraphViewer();
  const ids = new Set(dag.nodes.map((n) => n.id));
  const edges = dag.edges.filter((e) => ids.has(e.from) && ids.has(e.to));
  const preds = Object.fromEntries(dag.nodes.map((n) => [n.id, []]));
  for (const e of edges) preds[e.to].push(e.from);
  const auto = FlowGraph.autoLayout(dag.nodes.map((n) => n.id), preds);
  const saved = flowLayouts.get(flow);
  const positions = saved && dag.nodes.every((n) => saved[n.step ?? n.id]) ? Object.fromEntries(dag.nodes.map((n) => [n.id, saved[n.step ?? n.id]])) : auto.positions;
  const height = FlowGraph.bounds(positions).height;

    nodes: dag.nodes.map((n) => {
      const { status, state, worker } = runNodeStatus(n);
      const took = n.finished_at && n.started_at ? ` · ${secs(n.started_at, n.finished_at)}` : "";
      // Which PC each step is on, where that matters more than how long it took.
      return { id: n.id, label: n.label, sub: worker ? `${worker} · ${status}` : status + took, kind: n.kind, state, selected: n.id === selectedNode, problem: !!n.error, ariaLabel: `${n.label}: ${status}` };
    }),
    edges: edges.map((e) => ({ from: e.from, to: e.to, kind: e.kind })),

  });

  renderNodePanel();
}

function runGraphCard(target) {

function secs(a, b) {
  return span((new Date(b) - new Date(a)) / 1000);
}

function selectNode(id) {

// The newest page when a node is selected, then only lines added since (`after`).
async function refreshNodeLogs() {
  const node = dag?.nodes.find((n) => n.id === selectedNode);
  if (!node?.ref) { nodeLog.reset(null); nodeLog.state.loaded = true; nodeLog.render(); return; }
  const base = `/api/cards/${system}/${encodeURIComponent(openCardId)}/nodes/${encodeURIComponent(node.ref)}/logs?limit=1000`;
  if (nodeLog.state.id !== node.ref) nodeLog.reset(node.ref, (before) => api("GET", `${base}&before=${before}`));
  if (node.kind) return; // Portable steps stream on the existing SSE connection.
  const { state } = nodeLog, key = runKey(), nodeId = selectedNode, serial = ++nodeLogSerial;
  try {
    const data = await api("GET", state.loaded ? `${base}&after=${state.start + state.lines.length}` : base);
    if (key !== runKey() || nodeId !== selectedNode || serial !== nodeLogSerial || state.id !== node.ref) return;
    nodeLog.apply(data);
  } catch (e) { if (key === runKey() && nodeId === selectedNode && serial === nodeLogSerial) setStatus(e.message, true); }
}
