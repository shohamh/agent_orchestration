name: Worker release

# Builds the static agent-worker binaries and bundled Confluence runtimes; publishes them for a tag worker-vX.Y.Z.
# The GitLab pipeline (.gitlab-ci.yml) runs the same scripts in worker/ci/ and does the same.
on:
  push:
    branches: [main]
    paths: ['worker/**', 'agents/flowkit/**', 'agents/agentdriver/**', '.github/workflows/worker-release.yml']
    tags: ['worker-v*']
  pull_request:
    paths: ['worker/**', 'agents/flowkit/**', 'agents/agentdriver/**', '.github/workflows/worker-release.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker
      - run: cargo test --locked

  build-linux:
    runs-on: ubuntu-latest
    container: rust:alpine   # musl by default: the build is one static binary
    steps:
      - run: apk add --no-cache build-base git file
      - uses: actions/checkout@v4
      - run: sh worker/ci/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: agent-worker-linux
          path: dist/worker/agent-worker-x86_64-unknown-linux-musl*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker
      - name: Build and sign Windows worker
        env:
          WORKER_SIGNING_PFX_BASE64: ${{ startsWith(github.ref, 'refs/tags/worker-v') && secrets.WORKER_SIGNING_PFX_BASE64 || '' }}
          WORKER_SIGNING_PFX_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/worker-v') && secrets.WORKER_SIGNING_PFX_PASSWORD || '' }}
        run: pwsh worker/ci/build.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: agent-worker-windows
          path: dist/worker/agent-worker-x86_64-pc-windows-msvc.exe*
          if-no-files-found: error

  build-confluence-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python worker/ci/build-confluence-runtime.py --os windows
      - run: python worker/ci/build-confluence-runtime.py --os linux
      - uses: actions/upload-artifact@v4
        with:
          name: confluence-runtime
          path: dist/worker/confluence-runtime-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/worker-v')
    needs: [test, build-linux, build-windows, build-confluence-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: sh worker/ci/check-version.sh "${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Collect the release assets
        run: |
          mkdir -p dist/worker
          cp artifacts/agent-worker-* artifacts/confluence-runtime-* dist/worker/
          sh worker/ci/release-assets.sh dist/release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/release/* --title "agent-worker ${GITHUB_REF_NAME#worker-v}" --generate-notes
