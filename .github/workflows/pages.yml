# Publish comparison-page/ to GitHub Pages on every push to main that touches it.
# The page is an HTML fragment (no doctype/head), so it is wrapped in a minimal document here
# instead of editing the source.
name: Pages

on:
  push:
    branches: [main]
    paths: ["comparison-page/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site
          cp -r comparison-page/. _site/
          if ! grep -qi '<!doctype' comparison-page/index.html; then
            {
              echo '<!doctype html>'
              echo '<html lang="en"><head><meta charset="utf-8">'
              echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
              echo '</head><body>'
              cat comparison-page/index.html
              echo '</body></html>'
            } > _site/index.html
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
