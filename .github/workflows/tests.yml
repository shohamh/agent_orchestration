name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '20 2 * * *'

permissions:
  contents: read

jobs:
  unit-and-fixture:
    name: Unit and fixture integration tests
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - name: Install worker and exporter dependencies
        run: python -m pip install -r agents/requirements.txt
      - name: Agent and Confluence fixture tests
        run: python -m unittest discover -s agents/tests -v
      - name: Native worker compatibility tests
        run: python -m unittest discover -s agents -p 'test_hatchet*.py' -v
      - name: Board tests
        run: python -m unittest discover -s board -p 'test_*.py' -v
      - name: Chat UI tests
        run: node --test board/static/chat.test.cjs board/static/chat.browser.test.cjs board/static/flow-builder.test.cjs board/static/flow-builder.browser.test.cjs board/static/card-search.test.cjs board/static/card-search.browser.test.cjs
      - name: Install Trigger.dev test dependencies
        run: npm ci --prefix trigger.dev/example-project
      - name: Trigger.dev bridge tests
        working-directory: trigger.dev/example-project
        env:
          AGENT_PYTHON: python
        run: node --import tsx --test src/agent-session.test.ts

  public-confluence:
    name: Public Confluence integration tests
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - name: Install worker and exporter dependencies
        run: python -m pip install -r agents/requirements.txt
      - name: Import public page trees and transfer a page between workers
        run: python -m unittest discover -s agents/integration_tests -v

  fleet-worker-linux:
    name: Build Linux Fleet worker for engine E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: worker
      - name: Install musl linker
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build the Linux Rust worker
        run: sh worker/ci/build.sh
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - name: Build the offline native-engine runtime
        run: python worker/ci/build-native-runtime.py --os linux
      - uses: actions/upload-artifact@v4
        with:
          name: fleet-worker-linux
          path: |
            dist/worker/agent-worker-x86_64-unknown-linux-musl*
            dist/worker/native-runtime-linux.tar.gz*
          if-no-files-found: error

  native-engine-public:
    needs: fleet-worker-linux
    name: Public Confluence with ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        engine: [hatchet, prefect]
    env:
      PYTHONUTF8: '1'
      DO_NOT_TRACK: '1'
      ENGINE: ${{ matrix.engine }}
      FLOW_BACKENDS: ${{ matrix.engine }}
      FLOW_HOST_URL: http://127.0.0.1:8095
      BOARD_PORT: '8093'
      HATCHET_CLIENT_TLS_STRATEGY: none
      PREFECT_API_URL: ${{ matrix.engine == 'prefect' && 'http://127.0.0.1:4200/api' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: fleet-worker-linux
          path: dist/worker
      - name: Configure endpoints reachable by the Fleet container
        run: |
          host_ip="$(ip route get 1.1.1.1 | awk '{for (i=1;i<=NF;i++) if ($i=="src") {print $(i+1); exit}}')"
          test -n "$host_ip"
          {
            echo "CI_HOST_IP=$host_ip"
            echo "BOARD_HOST=0.0.0.0"
            echo "HATCHET_HOST=$host_ip"
            echo "HATCHET_CLIENT_HOST_PORT=$host_ip:7077"
            echo "HATCHET_CLIENT_SERVER_URL=http://$host_ip:8080"
            echo "PREFECT_WORKER_API_URL=http://$host_ip:4200/api"
            echo "FLOW_RELAY_URL=http://127.0.0.1:8097"
          } >> "$GITHUB_ENV"
      - name: Build actual Rust worker container
        run: docker build -f worker/ci/Dockerfile.fleet-e2e -t fleet-worker-e2e .
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - name: Install worker and exporter dependencies
        run: python -m pip install -r agents/requirements.txt
      - name: Start disposable Hatchet stack
        if: matrix.engine == 'hatchet'
        run: |
          cp hatchet/.env.example hatchet/.env
          admin_password="FleetCI-$(openssl rand -hex 24)-Aa9!"
          echo "::add-mask::$admin_password"
          printf 'HATCHET_ADMIN_PASSWORD=%s\n' "$admin_password" >> hatchet/.env
          docker compose --env-file hatchet/.env -f hatchet/docker-compose.yml up -d
          sh hatchet/scripts/create-token.sh
      - name: Start disposable Prefect stack
        if: matrix.engine == 'prefect'
        run: |
          cp prefect/.env.example prefect/.env
          docker compose --env-file prefect/.env -f prefect/docker-compose.yml up -d prefect-server
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4200/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          echo 'Prefect server did not become ready' >&2
          exit 1
      - name: Start native coordinator and board
        run: |
          nohup python -u agents/flow_host.py > "$RUNNER_TEMP/flow-host.log" 2>&1 &
          nohup python -u -c 'import runpy,sys; from dotenv import load_dotenv; load_dotenv("hatchet/.env"); sys.path.insert(0,"board"); runpy.run_path("board/server.py",run_name="__main__")' > "$RUNNER_TEMP/board.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8095/flows >/dev/null && curl -fsS http://127.0.0.1:8093/api/systems >/dev/null; then exit 0; fi
            sleep 2
          done
          echo 'Flow host or board did not become ready' >&2
          exit 1
      - name: Import public Cloud page, transfer between workers and restart the native step
        run: python -u board/workers_smoke_test.py --base http://127.0.0.1:8093 --systems "$ENGINE" --public-confluence
      - name: Register container worker and run through the native engine
        run: python -u board/fleet_worker_container_smoke_test.py --base http://127.0.0.1:8093 --server-address "http://$CI_HOST_IP:8093" --engine "$ENGINE" --image fleet-worker-e2e
      - name: Show redacted runtime logs on failure
        if: failure()
        run: |
          python - <<'PY'
          from dotenv import dotenv_values
          from pathlib import Path
          import os
          token = dotenv_values('hatchet/.env').get('HATCHET_CLIENT_TOKEN') or ''
          for name in ('flow-host.log', 'board.log'):
              path = Path(os.environ['RUNNER_TEMP']) / name
              if path.is_file():
                  text = '\n'.join(path.read_text(encoding='utf-8', errors='replace').splitlines()[-100:])
                  print(f'--- {name} ---')
                  print(text.replace(token, '[redacted]') if token else text)
          PY
      - name: Stop disposable stack
        if: always()
        run: docker compose --env-file "$ENGINE/.env" -f "$ENGINE/docker-compose.yml" down --remove-orphans
