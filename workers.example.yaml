# Copy to ignored workers.local.yaml on the coordinator PC. Start a service on each execution PC.
# The coordinator owns pools, tags and limits. Keep token values in workers.local.env.
version: 2
workers:
  - id: local
    url: http://127.0.0.1:8096
    pools: [default]
    tags: []
    slots: 1
    cpu_limit: 90
    ram_limit: 90
    token_env: FLOW_WORKER_TOKEN
