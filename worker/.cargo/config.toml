[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# Every dependency is in worker/vendor, so builds need no network (offline servers, CI without internet).
# Refresh it with worker/ci/vendor.sh after changing Cargo.toml.
[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"

[net]
offline = true
