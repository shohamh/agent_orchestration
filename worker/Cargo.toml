[package]
name = "agent-worker"
version = "0.1.0"
edition = "2021"
description = "The execution worker for the agent orchestration fleet: service, relay connector, runner and management command in one static binary"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
bytes = "1"
regex = "1"
subtle = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio-util = { version = "0.7", features = ["io"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_SystemInformation", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
