# Optional overlay: also export worker traces to the shared OTLP backend (../observability).
# Traces always go to the Hatchet dashboard as well. Requires the observability stack to be up.
# Enable: COMPOSE_FILE=docker-compose.yml:docker-compose.otel.yml in .env
x-otel: &otel
  networks: [default, otel]
  environment:
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

services:
  example-worker: *otel
  hardware-station-a: *otel
  hardware-station-b: *otel

networks:
  otel:
    external: true
