# Builds the static agent-worker binaries and bundled Confluence/native runtimes; publishes them for a tag worker-vX.Y.Z.
# The GitHub workflow (.github/workflows/worker-release.yml) builds and publishes the same assets.
#
# Runners: Linux jobs run on Docker runners. The Windows worker and native-runtime jobs need a Windows runner; on GitLab.com
# they use the shared Windows runner, while self-managed instances can set WINDOWS_RUNNER_TAG to their runner tag.

stages: [test, build, release]

variables:
  WINDOWS_RUNNER_TAG: saas-windows-medium-amd64
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home

.worker-rules: &worker-rules
  rules:
    - if: $CI_COMMIT_TAG =~ /^worker-v/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ['worker/**/*', 'agents/flowkit/**/*', 'agents/agentdriver/**/*', 'agents/native_engine_worker.py', '.gitlab-ci.yml']
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: ['worker/**/*', 'agents/flowkit/**/*', 'agents/agentdriver/**/*', 'agents/native_engine_worker.py', '.gitlab-ci.yml']

worker:test:linux:
  stage: test
  image: rust:alpine
  <<: *worker-rules
  before_script: [apk add --no-cache build-base git]
  script:
    - cd worker && cargo test --locked
  cache:
    key: worker-cargo-linux
    paths: [.cargo-home/registry, worker/target]

worker:test:windows:
  stage: test
  tags: [$WINDOWS_RUNNER_TAG]
  <<: *worker-rules
  script:
    - cd worker
    - cargo test --locked

worker:build:linux:
  stage: build
  image: rust:alpine   # musl by default: the build is one static binary
  <<: *worker-rules
  before_script: [apk add --no-cache build-base git file]
  script:
    - sh worker/ci/build.sh
  artifacts:
    paths: [dist/worker/agent-worker-x86_64-unknown-linux-musl, dist/worker/agent-worker-x86_64-unknown-linux-musl.sha256]
    expire_in: 30 days
  cache:
    key: worker-cargo-linux
    paths: [.cargo-home/registry, worker/target]

# Configure WORKER_SIGNING_PFX_BASE64 and WORKER_SIGNING_PFX_PASSWORD as protected CI/CD variables.
# The shared build script detects worker-v tags and fails closed unless both signing secrets verify.
worker:build:windows:
  stage: build
  tags: [$WINDOWS_RUNNER_TAG]
  <<: *worker-rules
  script:
    - pwsh worker/ci/build.ps1
  artifacts:
    paths: [dist/worker/agent-worker-x86_64-pc-windows-msvc.exe, dist/worker/agent-worker-x86_64-pc-windows-msvc.exe.sha256]
    expire_in: 30 days

worker:build:confluence-runtime:
  stage: build
  image: python:3.12-slim
  <<: *worker-rules
  script:
    - python worker/ci/build-confluence-runtime.py --os windows
    - python worker/ci/build-confluence-runtime.py --os linux
    - printf 'WORKER_RELEASE_VERSION=%s\n' "${CI_COMMIT_TAG#worker-v}" > dist/worker/release.env
  artifacts:
    paths: [dist/worker/confluence-runtime-*]
    reports:
      dotenv: dist/worker/release.env
    expire_in: 30 days

worker:build:native-runtime:linux:
  stage: build
  image: python:3.12-slim
  <<: *worker-rules
  needs: ["worker:build:confluence-runtime"]
  script:
    - python worker/ci/build-native-runtime.py --os linux
  artifacts:
    paths: [dist/worker/native-runtime-linux.tar.gz, dist/worker/native-runtime-linux.tar.gz.sha256]
    expire_in: 30 days

worker:build:native-runtime:windows:
  stage: build
  tags: [$WINDOWS_RUNNER_TAG]
  <<: *worker-rules
  needs: ["worker:build:confluence-runtime"]
  script:
    - pwsh -NoProfile -Command "python worker/ci/build-native-runtime.py --os windows"
  artifacts:
    paths: [dist/worker/native-runtime-windows.tar.gz, dist/worker/native-runtime-windows.tar.gz.sha256]
    expire_in: 30 days

worker:release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^worker-v/
  needs: ["worker:build:linux", "worker:build:windows", "worker:build:confluence-runtime", "worker:build:native-runtime:linux", "worker:build:native-runtime:windows"]
  before_script: [apk add --no-cache curl coreutils]
  script:
    - sh worker/ci/check-version.sh "$CI_COMMIT_TAG"
    - sh worker/ci/release-assets.sh dist/release
    # Upload to the project's generic package registry; the release links to these files.
    - |
      VERSION="$WORKER_RELEASE_VERSION"
      for f in dist/release/*; do
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/agent-worker/$VERSION/$(basename "$f")"
      done
  release:
    tag_name: $CI_COMMIT_TAG
    name: agent-worker $CI_COMMIT_TAG
    description: "The static agent-worker binaries for Windows x86_64 and Linux x86_64, plus the bundled Confluence runtimes (Linux runtime requires glibc 2.26+) and native Hatchet/Prefect runtimes."
    assets:
      links:
        - name: agent-worker-x86_64-pc-windows-msvc.exe
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/agent-worker/$WORKER_RELEASE_VERSION/agent-worker-x86_64-pc-windows-msvc.exe
          link_type: package
        - name: agent-worker-x86_64-unknown-linux-musl
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/agent-worker/$WORKER_RELEASE_VERSION/agent-worker-x86_64-unknown-linux-musl
          link_type: package
        - name: confluence-runtime-windows.tar.gz
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/agent-worker/$WORKER_RELEASE_VERSION/confluence-runtime-windows.tar.gz
          link_type: package
        - name: confluence-runtime-linux.tar.gz
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/agent-worker/$WORKER_RELEASE_VERSION/confluence-runtime-linux.tar.gz
          link_type: package
        - name: native-runtime-windows.tar.gz
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/agent-worker/$WORKER_RELEASE_VERSION/native-runtime-windows.tar.gz
          link_type: package
        - name: native-runtime-linux.tar.gz
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/agent-worker/$WORKER_RELEASE_VERSION/native-runtime-linux.tar.gz
          link_type: package
        - name: SHA256SUMS
          url: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/agent-worker/$WORKER_RELEASE_VERSION/SHA256SUMS
          link_type: other
